<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>16号螺旋酒馆 · 时间线</title>
    <link rel="stylesheet" href="../css/tavern.css?v=v2.3.0">
    <style>
        /* 颜色变量/重置/滚动条见 ../css/tavern.css */
        body {
            background: #0c0806;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            padding: 40px 20px 60px;
            min-height: 100vh;
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
        }

        /* 页眉 */
        .header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.06em;
        }
        .header .back {
            display: inline-block;
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: 0.3s;
        }
        .header .back:hover {
            border-bottom-color: var(--gold);
            color: var(--gold);
        }

        /* 时间线 */
        .timeline {
            position: relative;
            padding-left: 40px;
        }
        .timeline::before {
            content: "";
            position: absolute;
            left: 12px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(214, 168, 93, 0.15);
        }

        .event {
            position: relative;
            margin-bottom: 32px;
            padding: 18px 22px;
            background: rgba(26, 21, 19, 0.6);
            border: 1px solid rgba(90, 72, 59, 0.25);
            border-radius: 6px;
            transition: 0.3s;
        }
        .event:hover {
            border-color: rgba(214, 168, 93, 0.2);
            background: rgba(26, 21, 19, 0.85);
        }

        /* 时间轴圆点 */
        .event::before {
            content: "";
            position: absolute;
            left: -34px;
            top: 22px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid #0c0806;
            box-shadow: 0 0 0 3px rgba(214, 168, 93, 0.15);
        }

        .event .date {
            font-size: 13px;
            color: var(--gold);
            letter-spacing: 0.04em;
            font-weight: 700;
            font-family: "Arial Narrow", sans-serif;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .event .title {
            font-size: 18px;
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .event .desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
        }

        .event .tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .event .tags span {
            background: rgba(214, 168, 93, 0.08);
            border: 1px solid rgba(214, 168, 93, 0.1);
            color: var(--muted);
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 0.04em;
        }

        /* 事件关联人物 */
        .event .people {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 12px;
        }
        .event .people .person-link {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px dotted rgba(214,168,93,.5);
            padding-bottom: 1px;
            transition: 0.25s;
        }
        .event .people .person-link:hover {
            text-shadow: 0 0 8px rgba(214,168,93,.45);
            border-bottom-color: var(--gold);
        }
        .event .people .person-unknown {
            color: var(--muted);
            opacity: 0.65;
        }

        /* 人物筛选 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: -18px 0 30px;
        }
        .filter-bar .chip {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.04em;
            padding: 4px 14px;
            border-radius: 14px;
            cursor: pointer;
            color: var(--muted);
            background: rgba(26,21,19,.6);
            border: 1px solid rgba(90,72,59,.45);
            transition: 0.25s;
        }
        .filter-bar .chip:hover {
            color: var(--gold);
            border-color: rgba(214,168,93,.5);
        }
        .filter-bar .chip.active {
            color: #1a1513;
            background: var(--gold);
            border-color: var(--gold);
            font-weight: 700;
        }

        /* 空状态 */
        .empty-timeline {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            border: 1px dashed rgba(90,72,59,0.3);
            border-radius: 8px;
        }

        /* 页脚 */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid rgba(90,72,59,0.15);
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            body { padding: 24px 16px 40px; }
            .timeline { padding-left: 28px; }
            .event::before { left: -22px; width: 10px; height: 10px; }
            .event .title { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <!-- 页眉 -->
    <div class="header">
        <h1>🕰️ 时间线</h1>
        <a class="back" href="../">← 返回酒馆</a>
    </div>

    <!-- 人物筛选 -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- 时间线 -->
    <div class="timeline" id="timeline">
        <!-- 由 JavaScript 动态渲染 -->
    </div>

    <!-- 页脚 -->
    <div class="footer">
        <a class="foot-link" href="../">档案袋</a>
        <a class="foot-link" href="../drinker/">旅客档案</a>
        <a class="foot-link" href="../menu/">🍺 酒单</a>
        <a class="foot-link" href="../bar/">🍸 吧台</a>
        <a class="foot-link" href="../achievements/">🏆 成就</a>
        <span>🕰️ 时间线</span>
        <a class="foot-link" href="../map/">🗺️ 地图</a>
    </div>
</div>

<script src="../js/tavern-core.js?v=v2.3.0"></script>
<script>
    // 到访统计 + 成就系统
    if (window.Tavern) Tavern.init('..');
</script>

<script>
    // ============================================
    // 📅 数据：事件来自 data/events.json，花名册来自 data/people.json
    // ============================================

    const loadJSON = (window.Tavern && Tavern.loadJSON) ||
        (p => fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));

    let events = [];        // 全部事件
    let roster = new Set(); // 花名册（用于判断人名是否可点 / chips 排序）
    let personOrder = [];   // 花名册顺序（people.json 顺序即档案编号序）
    let activeName = null;  // 当前筛选人物，null = 全部

    function eventPersonNames(event) {
        return Array.isArray(event.people) ? event.people : [];
    }

    function personHTML(name) {
        if (roster.has(name)) {
            return `<a class="person-link" href="../drinker/?name=${encodeURIComponent(name)}">${escapeHtml(name)}</a>`;
        }
        // 未登记人名：灰色不可点（数据错误应由校验脚本发现）
        return `<span class="person-unknown">${escapeHtml(name)}</span>`;
    }

    // ============================================
    // 📜 渲染时间线
    // ============================================

    function renderTimeline() {
        const container = document.getElementById('timeline');
        const list = events
            .filter(e => !activeName || eventPersonNames(e).includes(activeName))
            .sort((a, b) => new Date(a.date) - new Date(b.date));

        if (list.length === 0) {
            container.innerHTML = `
                <div class="empty-timeline">
                    <div style="font-size:32px;margin-bottom:12px;">📭</div>
                    时间线上还没有记录。<br>
                    <span style="font-size:12px;">第一件事还在路上。</span>
                </div>
            `;
            return;
        }

        container.innerHTML = list.map(event => `
            <div class="event">
                <div class="date">${formatDate(event.date)}</div>
                <div class="title">${escapeHtml(event.title)}</div>
                <div class="desc">${escapeHtml(event.desc)}</div>
                ${eventPersonNames(event).length > 0 ? `
                    <div class="people">${eventPersonNames(event).map(personHTML).join('')}</div>
                ` : ''}
                ${event.tags && event.tags.length > 0 ? `
                    <div class="tags">
                        ${event.tags.map(tag => `<span>${escapeHtml(tag)}</span>`).join('')}
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    // ============================================
    // 🔎 人物筛选（chips + ?name= 同步）
    // ============================================

    function renderFilterBar() {
        const used = new Set();
        events.forEach(e => eventPersonNames(e).forEach(n => used.add(n)));
        if (used.size === 0) { document.getElementById('filterBar').innerHTML = ''; return; }
        // 已登记人物按花名册顺序，未登记的排末尾
        const names = [
            ...personOrder.filter(n => used.has(n)),
            ...[...used].filter(n => !roster.has(n)).sort((a, b) => a.localeCompare(b, 'zh'))
        ];
        document.getElementById('filterBar').innerHTML = ['全部', ...names].map(n => {
            const value = n === '全部' ? '' : n;
            const isActive = (activeName === null ? '全部' : activeName) === n;
            return `<button type="button" class="chip${isActive ? ' active' : ''}" data-name="${escapeHtml(value)}">${escapeHtml(n)}</button>`;
        }).join('');
    }

    document.getElementById('filterBar').addEventListener('click', e => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        const name = btn.dataset.name || null;
        if (name === activeName) return;
        activeName = name;
        history.replaceState(null, '', name ? `?name=${encodeURIComponent(name)}` : location.pathname);
        renderFilterBar();
        renderTimeline();
    });

    function formatDate(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year} · ${month}/${day}`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================
    // 🚀 启动
    // ============================================

    Promise.all([
        loadJSON('../data/events.json').then(d => (d && d.events) || []).catch(() => []),
        loadJSON('../data/people.json').then(d => d || []).catch(() => [])
    ]).then(([evs, people]) => {
        events = Array.isArray(evs) ? evs : [];
        personOrder = Array.isArray(people) ? people.map(p => p.name) : [];
        roster = new Set(personOrder);
        // ?name= 预选：名字不存在或无相关事件时静默回落到「全部」
        const urlName = new URLSearchParams(location.search).get('name');
        const used = new Set();
        events.forEach(e => eventPersonNames(e).forEach(n => used.add(n)));
        activeName = urlName && used.has(urlName) ? urlName : null;
        renderFilterBar();
        renderTimeline();
    });
</script>

</body>
</html>
