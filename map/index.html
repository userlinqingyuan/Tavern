<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>16号螺旋酒馆 · 地图</title>
    <style>
        :root {
            --ink: #eadcc0;
            --muted: #a08d72;
            --gold: #d6a85d;
            --line: #5d483b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html{scrollbar-width:thin;scrollbar-color:rgba(200,168,120,.45) rgba(72,50,28,.25)}
        html::-webkit-scrollbar{width:7px}
        html::-webkit-scrollbar-track{background:rgba(72,50,28,.25)}
        html::-webkit-scrollbar-thumb{background:rgba(200,168,120,.5);border-radius:4px}
        html::-webkit-scrollbar-thumb:hover{background:rgba(214,168,93,.7)}
        body {
            background: #0c0806;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            padding: 40px 20px 60px;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 页眉 */
        .header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.06em;
        }
        .header .back {
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: 0.3s;
        }
        .header .back:hover {
            border-bottom-color: var(--gold);
            color: var(--gold);
        }

        /* 地图网格 */
        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 12px;
        }
        .map-item {
            background: rgba(26, 21, 19, 0.5);
            border: 1px solid rgba(90, 72, 59, 0.25);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }
        .map-item:hover {
            border-color: rgba(214, 168, 93, 0.3);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .map-item img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 7 / 5;
            object-fit: contain;
            background: #0f0c0a;
            transition: 0.3s;
        }
        .map-item:hover img {
            filter: brightness(1.05);
        }
        .map-item .label {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.04em;
            border-top: 1px solid rgba(90, 72, 59, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .map-item .label .badge {
            font-size: 10px;
            color: var(--gold);
            background: rgba(214,168,93,0.08);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(214,168,93,0.1);
        }

        /* 灯箱（点击图片放大） */
        .lightbox-map {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(5, 3, 2, 0.88);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 40px;
            cursor: zoom-out;
        }
        .lightbox-map.open {
            display: flex;
        }
        .lightbox-map img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border: 1px solid rgba(214,168,93,0.1);
            border-radius: 6px;
            box-shadow: 0 16px 60px rgba(0,0,0,0.6);
            cursor: default;
        }
        .lightbox-map .close-btn {
            position: fixed;
            top: 20px;
            right: 28px;
            color: var(--muted);
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-family: inherit;
        }
        .lightbox-map .close-btn:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }
        .lightbox-map .caption {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.04em;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* 单图模式（只有一张图时） */
        .map-grid.single {
            grid-template-columns: 1fr;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 页脚 */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid rgba(90,72,59,0.15);
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 700px) {
            body { padding: 24px 16px 40px; }
            .map-grid { grid-template-columns: 1fr; gap: 16px; }
            .lightbox-map { padding: 16px; }
            .lightbox-map .close-btn { top: 12px; right: 16px; font-size: 24px; }
            .lightbox-map .caption { bottom: 16px; font-size: 11px; padding: 4px 14px; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <!-- 页眉 -->
    <div class="header">
        <h1>🗺️ 酒馆地图</h1>
        <a class="back" href="../">← 返回酒馆</a>
    </div>

    <!-- 地图网格 -->
    <div class="map-grid" id="mapGrid">
        <!-- 由 JavaScript 动态生成 -->
    </div>

    <!-- 页脚 -->
    <div class="footer">16号螺旋酒馆 · 地图 · 点击图片放大</div>
</div>

<!-- 灯箱 -->
<div class="lightbox-map" id="lightboxMap">
    <button class="close-btn" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="酒馆地图">
    <div class="caption" id="lightboxCaption">地图</div>
</div>

<script>
    // ============================================
    // 🗺️ 地图数据（改这里）
    // ============================================

    const maps = [
        {
            src: "map-v1.png",          // 图片文件名（放在同目录下）
            label: "酒馆一楼 · 2026",
            badge: "v1"
        },
        {
            src: "map-v2.png",          // 第二张图，如果不放可以直接删掉这一整项
            label: "酒馆二楼 · 2026",
            badge: "v2"
        }
        // 你想加第三张就在下面继续加，格式同上
        // {
        //     src: "map-v3.png",
        //     label: "酒馆最终地图",
        //     badge: "v3"
        // }
    ];

    // ============================================
    // 🖼️ 渲染
    // ============================================

    function renderMaps() {
        const grid = document.getElementById('mapGrid');

        if (maps.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed rgba(90,72,59,0.3);border-radius:8px;">
                    <div style="font-size:32px;margin-bottom:12px;">🗺️</div>
                    地图还在绘制中。
                </div>
            `;
            return;
        }

        // 如果只有一张图，使用 single 类居中
        if (maps.length === 1) {
            grid.classList.add('single');
        } else {
            grid.classList.remove('single');
        }

        grid.innerHTML = maps.map((map, index) => `
            <div class="map-item" data-index="${index}">
                <img src="${map.src}" alt="${map.label}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.label').textContent='⚠️ 图片加载失败'">
                <div class="label">
                    <span>${map.label}</span>
                    <span class="badge">${map.badge}</span>
                </div>
            </div>
        `).join('');

        // 绑定点击事件
        grid.querySelectorAll('.map-item').forEach(item => {
            item.addEventListener('click', function() {
                const index = parseInt(this.dataset.index);
                openLightbox(index);
            });
        });
    }

    // ============================================
    // 💡 灯箱
    // ============================================

    function openLightbox(index) {
        const map = maps[index];
        if (!map) return;

        const img = document.getElementById('lightboxImg');
        const caption = document.getElementById('lightboxCaption');
        const modal = document.getElementById('lightboxMap');

        img.src = map.src;
        img.alt = map.label;
        caption.textContent = map.label;

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightboxMap').classList.remove('open');
        document.body.style.overflow = '';
    }

    // 绑定关闭事件
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxMap').addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
    });

    // ============================================
    // 🚀 启动
    // ============================================

    renderMaps();
</script>

</body>
</html>
