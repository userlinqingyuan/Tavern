<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>16号螺旋酒馆 · 地图</title>
    <link rel="stylesheet" href="../css/tavern.css">
    <style>
        /* 颜色变量/重置/滚动条见 ../css/tavern.css */
        body {
            background: #0c0806;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            padding: 40px 20px 60px;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 页眉 */
        .header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.06em;
        }
        .header .back {
            color: var(--muted);
            font-size: 14px;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: 0.3s;
        }
        .header .back:hover {
            border-bottom-color: var(--gold);
            color: var(--gold);
        }

        /* 地图网格 */
        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 12px;
        }
        .map-item {
            background: rgba(26, 21, 19, 0.5);
            border: 1px solid rgba(90, 72, 59, 0.25);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }
        .map-item:hover {
            border-color: rgba(214, 168, 93, 0.3);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .map-item img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 7 / 5;
            object-fit: contain;
            background: #0f0c0a;
            transition: 0.3s;
        }
        .map-item:hover img {
            filter: brightness(1.05);
        }
        .map-wrapper {
            position: relative;
            overflow: hidden;
        }
        .map-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 7 / 5;
            object-fit: contain;
            background: #0f0c0a;
        }
        .footprint-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .footprint {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            z-index: 2;
        }
        .footprint-dot {
            display: block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(255, 200, 150, 0.15), inset 0 0 8px rgba(255, 200, 150, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .footprint-dot::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 150, 0.08), transparent 70%);
            animation: footprintPulse 3s ease-in-out infinite;
        }
        .footprint:hover .footprint-dot,
        .footprint.active .footprint-dot {
            transform: scale(1.5);
            box-shadow: 0 0 24px rgba(255, 200, 150, 0.3);
        }
        .footprint-label {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            background: rgba(12, 8, 6, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(214, 168, 93, 0.2);
            border-radius: 6px;
            padding: 6px 14px;
            white-space: nowrap;
            font-size: 12px;
            color: var(--ink);
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .footprint-label strong {
            color: var(--gold);
            font-weight: 700;
        }
        .footprint-label span {
            color: var(--muted);
            font-size: 10px;
            margin-left: 8px;
        }
        .footprint-label::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(214, 168, 93, 0.2);
        }
        .footprint:hover .footprint-label,
        .footprint.active .footprint-label {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        /* 足迹横向条 */
        .footprint-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            border-top: 1px solid rgba(90, 72, 59, 0.1);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(200, 168, 120, 0.45) rgba(72, 50, 28, 0.25);
        }
        .footprint-strip::-webkit-scrollbar { height: 6px; }
        .footprint-strip::-webkit-scrollbar-track { background: rgba(72, 50, 28, 0.25); border-radius: 3px; }
        .footprint-strip::-webkit-scrollbar-thumb { background: rgba(200, 168, 120, 0.5); border-radius: 3px; }
        .footprint-strip::-webkit-scrollbar-thumb:hover { background: rgba(214, 168, 93, 0.7); }
        .footprint-chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 13px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--ink);
            background: rgba(214, 168, 93, 0.06);
            border: 1px solid rgba(214, 168, 93, 0.14);
            white-space: nowrap;
            cursor: default;
        }
        .footprint-chip i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex: 0 0 auto;
        }
        .footprint-chip em {
            font-style: normal;
            color: var(--muted);
            font-size: 11px;
        }
        .footprint-strip .strip-empty {
            flex: 0 0 auto;
            font-size: 12px;
            color: var(--muted);
            padding: 5px 4px;
        }
        /* 足迹可点跳档案 */
        a.footprint { text-decoration: none; }
        a.footprint-chip {
            cursor: pointer;
            text-decoration: none;
            transition: border-color .2s, background .2s;
        }
        a.footprint-chip:hover {
            border-color: rgba(214, 168, 93, .45);
            background: rgba(214, 168, 93, .12);
        }
        /* 从档案页跳来时高亮目标足迹 */
        .footprint.is-target .footprint-dot {
            transform: scale(1.5);
            border-color: var(--gold);
            box-shadow: 0 0 0 5px rgba(214, 168, 93, .25), 0 0 22px rgba(214, 168, 93, .65);
        }
        .footprint.is-target .footprint-label {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .footprint-chip.is-target {
            border-color: rgba(214, 168, 93, .6);
            background: rgba(214, 168, 93, .16);
        }
        @keyframes footprintPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }
        @media (hover: none) {
            .footprint-label {
                opacity: 0;
                transform: translateX(-50%) scale(0.9);
                pointer-events: none;
                white-space: normal;
                max-width: 160px;
            }
            #lightboxFootprints .footprint-label {
                white-space: normal;
                max-width: min(240px, 74vw);
            }
            .footprint.active .footprint-label {
                opacity: 1;
                transform: translateX(-50%) scale(1);
                pointer-events: auto;
            }
        }
        .map-item .label {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.04em;
            border-top: 1px solid rgba(90, 72, 59, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .map-item .label .badge {
            font-size: 10px;
            color: var(--gold);
            background: rgba(214,168,93,0.08);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(214,168,93,0.1);
        }

        /* 灯箱（点击图片放大） */
        .lightbox-map {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(5, 3, 2, 0.88);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 40px;
            cursor: zoom-out;
        }
        .lightbox-map.open {
            display: flex;
        }
        .lightbox-map {
            flex-direction: column;
            gap: 16px;
        }
        .lightbox-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 96vw;
            max-height: 96vh;
        }
        .lightbox-mapview {
            position: relative;
            display: inline-block;
            line-height: 0;
        }
        .lightbox-mapview img {
            display: block;
            max-width: 92vw;
            max-height: 72vh;
        }
        .lightbox-footprints {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        /* 大图模式足迹背景条：随页面宽度缩放 */
        #lightboxStrip {
            width: min(96vw, 900px);
            max-width: 96vw;
            background: rgba(26, 21, 19, 0.68);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(214, 168, 93, 0.16);
            border-radius: 12px;
            padding: 12px 16px;
        }
        #lightboxStrip .footprint-chip {
            font-size: clamp(13px, 2.6vw, 16px);
            padding: 8px 18px;
            border-radius: 20px;
            gap: 9px;
        }
        #lightboxStrip .footprint-chip i {
            width: 12px;
            height: 12px;
        }
        #lightboxStrip .footprint-chip em {
            font-size: clamp(11px, 2.1vw, 13px);
        }
        /* 大图画面上的足迹标记：加大、随页面缩放 */
        #lightboxFootprints .footprint-dot {
            width: clamp(18px, 2.6vw, 26px);
            height: clamp(18px, 2.6vw, 26px);
            border-width: 3px;
        }
        #lightboxFootprints .footprint-dot::after {
            inset: -9px;
        }
        #lightboxFootprints .footprint-label {
            padding: 8px 18px;
            border-radius: 9px;
            font-size: clamp(13px, 2.4vw, 17px);
            line-height: 1.7;
            white-space: nowrap;
        }
        #lightboxFootprints .footprint-label strong {
            font-size: 1em;
        }
        #lightboxFootprints .footprint-label span {
            font-size: clamp(11px, 2vw, 13px);
            margin-left: 10px;
        }
        .lightbox-map img {
            object-fit: contain;
            cursor: default;
        }
        .lightbox-map .close-btn {
            position: fixed;
            top: 20px;
            right: 28px;
            color: var(--muted);
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-family: inherit;
        }
        .lightbox-map .close-btn:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }
        .lightbox-map .caption {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.04em;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* 单图模式（只有一张图时） */
        .map-grid.single {
            grid-template-columns: 1fr;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 页脚 */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid rgba(90,72,59,0.15);
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (max-width: 700px) {
            body { padding: 24px 16px 40px; }
            .map-grid { grid-template-columns: 1fr; gap: 16px; }
            .lightbox-map { padding: 16px; }
            .lightbox-map .close-btn { top: 12px; right: 16px; font-size: 24px; }
            .lightbox-map .caption { bottom: 16px; font-size: 11px; padding: 4px 14px; }
            /* 移动端缩略图上不再叠散点，改用下方横向足迹条 */
            .map-item .footprint-layer { display: none; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <!-- 页眉 -->
    <div class="header">
        <h1>🗺️ 酒馆地图</h1>
        <a class="back" href="../">← 返回酒馆</a>
    </div>

    <!-- 地图网格 -->
    <div class="map-grid" id="mapGrid">
        <!-- 由 JavaScript 动态生成 -->
    </div>

    <!-- 页脚 -->
    <div class="footer">
        <a class="foot-link" href="../">档案袋</a>
        <a class="foot-link" href="../drinker/">旅客档案</a>
        <a class="foot-link" href="../menu/">🍺 酒单</a>
        <a class="foot-link" href="../achievements/">🏆 成就</a>
        <a class="foot-link" href="../timeline/">🕰️ 时间线</a>
        <span>🗺️ 地图 · 点击图片放大</span>
    </div>
</div>

<!-- 灯箱 -->
<div class="lightbox-map" id="lightboxMap">
    <button class="close-btn" id="lightboxClose">✕</button>
    <div class="lightbox-body">
        <div class="lightbox-mapview">
            <img id="lightboxImg" src="" alt="酒馆地图">
            <div class="lightbox-footprints" id="lightboxFootprints"></div>
        </div>
        <div class="footprint-strip" id="lightboxStrip"></div>
    </div>
    <div class="caption" id="lightboxCaption">地图</div>
</div>

<script src="../js/tavern-core.js"></script>
<script>
    if (window.Tavern) Tavern.init('..');
</script>
<script>
    // ============================================
    // 🗺️ 地图数据（改这里）
    // ============================================

    const maps = [
        {
            src: "map-v1.png",          // 图片文件名（放在同目录下）
            label: "酒馆一楼 · 2026",
            badge: "v1"
        },
        {
            src: "map-v2.png",          // 第二张图，如果不放可以直接删掉这一整项
            label: "酒馆二楼 · 2026",
            badge: "v2"
        }
        // 你想加第三张就在下面继续加，格式同上
        // {
        //     src: "map-v3.png",
        //     label: "酒馆最终地图",
        //     badge: "v3"
        // }
    ];

    // ============================================
    // 👣 旅客足迹（单一数据源：../data/people.json 的 map 字段）
    // ============================================

    let footprints = [];

    // 每个人的点颜色由名字稳定决定（数据里不存颜色）
    const FP_COLORS = ['#d6a85d','#8fb0c0','#c08060','#b09070','#b0a080','#d4a0b0','#b8a070','#b8c8b0','#9a7fb8','#c07a7a'];
    function colorForName(name) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return FP_COLORS[h % FP_COLORS.length];
    }

    function buildFootprints(people) {
        return people
            .filter(p => p && p.map && p.name !== '？？？')
            .map(p => ({
                mapIndex: p.map.floor,
                x: p.map.x,
                y: p.map.y,
                name: p.name,
                label: p.map.label || '酒馆',
                color: colorForName(p.name)
            }));
    }

    function drinkerURL(name) {
        return '../drinker/?name=' + encodeURIComponent(name);
    }

    // 足迹标记 / 足迹条 HTML（点击跳转到对应档案）
    function footprintMarkerHTML(fp) {
        return `
            <a class="footprint" data-name="${fp.name}" href="${drinkerURL(fp.name)}"
               title="查看 ${fp.name} 的档案" aria-label="查看 ${fp.name} 的档案"
               style="left:${fp.x}%;top:${fp.y}%;">
                <span class="footprint-dot" style="background:${fp.color};"></span>
                <span class="footprint-label">
                    <strong>${fp.name}</strong>
                    <span>${fp.label}</span>
                </span>
            </a>`;
    }

    function footprintChipHTML(fp) {
        return `
            <a class="footprint-chip" data-name="${fp.name}" href="${drinkerURL(fp.name)}">
                <i style="background:${fp.color};"></i>
                ${fp.name}<em>· ${fp.label}</em>
            </a>`;
    }

    function footprintChipsHTML(mapIndex) {
        const mapFootprints = footprints.filter(fp => fp.mapIndex === mapIndex);
        if (mapFootprints.length === 0) {
            return '<span class="strip-empty">暂无足迹</span>';
        }
        return mapFootprints.map(footprintChipHTML).join('');
    }

    // ============================================
    // 🖼️ 渲染
    // ============================================

    function renderMaps() {
    const grid = document.getElementById('mapGrid');

    if (maps.length === 0) {
        grid.innerHTML = `<div class="empty-state">🗺️ 地图还在绘制中。</div>`;
        return;
    }

    if (maps.length === 1) {
        grid.classList.add('single');
    } else {
        grid.classList.remove('single');
    }

    grid.innerHTML = maps.map((map, mapIndex) => {
        // 筛选属于这张地图的足迹
        const mapFootprints = footprints.filter(fp => fp.mapIndex === mapIndex);

        return `
            <div class="map-item" data-index="${mapIndex}">
                <div class="map-wrapper">
                    <img src="${map.src}" alt="${map.label}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.label').textContent='⚠️ 图片加载失败'">
                    <!-- 足迹层 -->
                    <div class="footprint-layer">
                        ${mapFootprints.map(footprintMarkerHTML).join('')}
                    </div>
                </div>
                <div class="footprint-strip">${footprintChipsHTML(mapIndex)}</div>
                <div class="label">
                    <span>${map.label}</span>
                    <span class="badge">${map.badge} · ${mapFootprints.length} 处足迹</span>
                </div>
            </div>
        `;
    }).join('');

    // 绑定点击事件（灯箱）
    grid.querySelectorAll('.map-item').forEach(item => {
        item.addEventListener('click', function(e) {
            // 如果点击的是足迹本身或足迹条，不触发灯箱
            if (e.target.closest('.footprint') || e.target.closest('.footprint-strip')) return;
            const index = parseInt(this.dataset.index);
            openLightbox(index);
        });
    });
}

    // ============================================
    // 💡 灯箱
    // ============================================

    function openLightbox(index) {
        const map = maps[index];
        if (!map) return;

        const img = document.getElementById('lightboxImg');
        const caption = document.getElementById('lightboxCaption');
        const modal = document.getElementById('lightboxMap');
        const mapFootprints = footprints.filter(fp => fp.mapIndex === index);

        img.src = map.src;
        img.alt = map.label;
        caption.textContent = map.label;
        // 大图上也叠加足迹标记
        document.getElementById('lightboxFootprints').innerHTML = mapFootprints.map(footprintMarkerHTML).join('');
        // 大图下方同样提供横向足迹条
        document.getElementById('lightboxStrip').innerHTML = footprintChipsHTML(index);

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightboxMap').classList.remove('open');
        document.body.style.overflow = '';
    }

    // 绑定关闭事件
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxMap').addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
    });

    // 移动端点击足迹切换标签，点击其他区域关闭已展开标签。
    document.addEventListener('click', function(e) {
        const footprint = e.target.closest('.footprint');
        if (!footprint) {
            document.querySelectorAll('.footprint.active').forEach(item => item.classList.remove('active'));
            return;
        }

        footprint.classList.toggle('active');
        document.querySelectorAll('.footprint.active').forEach(item => {
            if (item !== footprint) item.classList.remove('active');
        });
    });

    // ============================================
    // 🎯 从档案页跳入：?name=泠钰 → 打开对应楼层灯箱并高亮足迹
    // ============================================

    function focusFootprintFromURL() {
        const name = new URLSearchParams(location.search).get('name');
        if (!name) return;
        const fp = footprints.find(f => f.name === name);
        if (!fp) return;
        openLightbox(fp.mapIndex);
        // openLightbox 同步填充灯箱 DOM，直接标记即可（不依赖 rAF，后台标签也可靠）
        document.querySelectorAll('#lightboxFootprints .footprint, #lightboxStrip .footprint-chip')
            .forEach(el => el.classList.toggle('is-target', el.dataset.name === name));
        const chip = document.querySelector('#lightboxStrip .footprint-chip.is-target');
        if (chip) chip.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    // ============================================
    // 🚀 启动：先取人物数据生成足迹，再渲染地图
    // ============================================

    Tavern.loadJSON('../data/people.json')
        .then(people => {
            if (Array.isArray(people)) footprints = buildFootprints(people);
        })
        .catch(() => { footprints = []; })
        .then(() => {
            renderMaps();
            focusFootprintFromURL();
        });
</script>

</body>
</html>
