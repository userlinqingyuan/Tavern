<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16号螺旋酒馆 · 旅客档案</title>
<style>
:root{
	--ink:#eee7d8;
	--muted:#b5aa98;
	--wood:#171412;
	--panel:#211b19;
	--panel2:#2c211d;
	--line:#5d483b;
	--gold:#d6a85d;
	--wine:#8f3944;
	--green:#718a70;
	--blue:#6e91aa;
	--shadow:0 18px 45px #0008;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);
	background-color:#0d0907;
	background-image:
		linear-gradient(180deg,rgba(8,5,4,.66),rgba(8,5,4,.40) 42%,rgba(8,5,4,.70)),
		radial-gradient(ellipse 105% 90% at 50% 40%,transparent 42%,rgba(5,3,2,.62) 100%),
		url('../images/bar2.jpg');
	background-size:auto,auto,cover;
	background-position:center;
	background-repeat:no-repeat;
	background-attachment:fixed;
	font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;
	line-height:1.65}body:before{content:"";
	position:fixed;inset:0;pointer-events:none;
	opacity:.07;background-image:linear-gradient(115deg,transparent 48%,#d6a85d 49%,transparent 50%);
	background-size:90px 90px}
/* ============================================
   📦 容器
   ============================================ */
.wrap {
    width: min(1380px, calc(100% - 40px));
    margin: auto;
}


/* ============================================
   🏷️ 页眉区
   ============================================ */
.masthead {
    padding: 68px 0 34px;
    border-bottom: 1px solid var(--line);
    position: relative;
}

/* 标签（如“档案室”） */
.kicker {
    color: var(--gold);
    letter-spacing: .18em;
    font: 700 12px/1.2 "Arial Narrow", sans-serif;
    text-transform: uppercase;
}

/* 大标题 */
.masthead h1 {
    margin: 10px 0 4px;
    font-size: clamp(38px, 6vw, 78px);
    line-height: 1.04;
    letter-spacing: 0;
}

/* 副标题/描述 */
.masthead p {
    margin: 12px 0 0;
    max-width: 700px;
    color: var(--muted);
    font-size: 15px;
}

/* 侧边印章装饰（右侧竖排文字） */
.seal {
    position: absolute;
    right: 2vw;
    top: 62px;
    color: var(--gold);
    font-size: 66px;
    opacity: .22;
    writing-mode: vertical-rl;
}


/* ============================================
   🔧 工具栏（搜索 + 筛选 + 计数）
   ============================================ */
.toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 22px 0;
}

.toolbar input,
.toolbar select {
    background: #171311d9;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 11px 14px;
    border-radius: 2px;
    font: inherit;
}

/* 搜索框 */
.toolbar input {
    min-width: 280px;
    flex: 1;
}

.fav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0 6px;
  transition: 0.3s;
  margin-left: 8px;
}

.fav-btn:hover {
  color: var(--gold);
  transform: scale(1.2);
}

.fav-btn.is-fav {
  color: var(--gold);
}

.card.is-fav {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(214, 168, 93, 0.15), var(--shadow);
}

.card.is-fav::after {
  border-color: rgba(214, 168, 93, 0.5);
}

/* 随机按钮悬停效果 */
#randomBtn:hover {
  background: var(--gold);
  color: #171311;
  border-color: var(--gold);
}

/* 角色数量 */
.count {
    margin-left: auto;
    color: var(--muted);
    font-size: 13px;
}


/* ============================================
   🃏 人物卡片网格
   ============================================ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 22px;
    padding: 12px 0 72px;
}


/* ============================================
   🎴 单张人物卡片
   ============================================ */
.card {
    background: linear-gradient(145deg, #2a211e, #171413);
    border: 1px solid #614b3d;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: perspective(600px) rotateY(8deg) translateX(-20px);
    animation-name: flipIn;
    animation-duration: 0.5s;
    animation-timing-function: ease;
    animation-fill-mode: forwards;
    /* animation-delay 由行内 style 控制，每个卡片不一样 */
}

/* 卡片内边框装饰 */
.card::before {
  content: "";
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at 70% 80%, rgba(210, 150, 70, 0.15), transparent 70%);
  pointer-events: none;
  animation: candleGlow 3s ease-in-out infinite alternate;
}

@keyframes candleGlow {
  0% { opacity: 0.4; transform: scale(0.95); }
  100% { opacity: 0.9; transform: scale(1.1); }
}

.card:after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid #d6a85d24;
    pointer-events: none;
}

/* 卡片高亮动画 */
.card.highlight {
  border-color: var(--gold);
  box-shadow: 0 0 30px rgba(214, 168, 93, 0.3);
}
.card.highlight::after {
  border-color: rgba(214, 168, 93, 0.65);
  animation: highlightPulse 1.2s ease;
}

@keyframes highlightPulse {
  0%, 100% {
    border-color: rgba(214, 168, 93, 0.25);
    box-shadow: inset 0 0 8px rgba(214, 168, 93, 0.15);
  }
  50% {
    border-color: rgba(214, 168, 93, 0.85);
    box-shadow: inset 0 0 28px rgba(214, 168, 93, 0.35);
  }
}


/* ============================================
   🖼️ 卡片头部（头像 + 姓名 + 基本信息）
   ============================================ */
.card-head {
    padding: 22px 22px 16px;
    display: flex;
    gap: 17px;
    align-items: flex-start;
}

/* 人物头像 */
.portrait {
    width: 94px;
    height: 116px;
    object-fit: cover;
    object-position: top;
    border: 2px solid var(--gold);
    background: #100e0c;
    cursor: zoom-in;
}

/* 角色名 */
.card h2 {
    margin: 0;
    font-size: 26px;
    line-height: 1.2;
}

/* 别名/称号 */
.alias {
    color: var(--gold);
    font-size: 12px;
    margin-top: 5px;
}

/* 属性值（力量/敏捷/等） */
.facts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px 12px;
    margin-top: 13px;
    color: var(--muted);
    font-size: 12px;
}

.facts span {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.facts b {
    display: block;
    color: var(--ink);
    font: 700 17px/1.2 "Arial Narrow", sans-serif;
}

/* 座位号/身份标识 */
.seat {
    color: var(--gold) !important;
}


/* ============================================
   📝 卡片正文区
   ============================================ */
.card-body {
    padding: 0 22px 22px;
}

/* 简介/描述 */
.intro {
    color: #e4d9c6;
    font-size: 14px;
    margin: 0 0 17px;
    min-height: 46px;
}


/* ============================================
   📋 卡片信息区块（两栏）
   ============================================ */
.sections {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 18px;
}

/* 每个信息小板块 */
.section {
    border-top: 1px solid var(--line);
    padding-top: 7px;
}

.section h3 {
    color: var(--gold);
    font: 700 12px/1 "Arial Narrow", sans-serif;
    letter-spacing: .14em;
    margin: 0 0 5px;
}

.section p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
}

/* 跨两栏的全宽区块 */
.section.full {
    grid-column: 1 / -1;
}

/* 资料来源/引用链接 */
.source {
    display: block;
    margin-top: 17px;
    color: #8e7764;
    font-size: 11px;
    text-decoration: none;
}
.source:hover {
    color: var(--gold);
}


/* ============================================
   🈳 空状态（无卡片时）
   ============================================ */
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: var(--muted);
    border: 1px dashed var(--line);
}


/* ============================================
   📌 页脚
   ============================================ */
footer {
    border-top: 1px solid var(--line);
    padding: 24px 0 50px;
    color: #897666;
    font-size: 12px;
}


/* ============================================
   📢 提示条
   ============================================ */
.note {
    background: #1a1513;
    border-left: 3px solid var(--wine);
    padding: 14px 17px;
    margin: 4px 0 26px;
    color: #b9a999;
    font-size: 13px;
}

.note strong {
    color: #d89878;
}


/* ============================================
   🎬 卡片入场动画
   ============================================ */
@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}
@keyframes flipIn {
    0% {
        opacity: 0;
        transform: perspective(600px) rotateY(10deg) translateX(-30px);
    }
    60% {
        opacity: 0.7;
        transform: perspective(600px) rotateY(-2deg) translateX(4px);
    }
    100% {
        opacity: 1;
        transform: perspective(600px) rotateY(0deg) translateX(0);
    }
}


/* ============================================
   🔍 灯箱（点击头像放大查看）
   ============================================ */
.lightbox {
    display: none;
    position: fixed;
    z-index: 5;
    inset: 0;
    background: #090807ee;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: min(95vw, 900px);
    max-height: 94vh;
    object-fit: contain;
    box-shadow: 0 0 0 1px var(--gold), 0 18px 70px #000;
}

/* 关闭按钮 */
.close {
    position: fixed;
    right: 24px;
    top: 16px;
    color: var(--gold);
    font-size: 34px;
}
/* 页面卡片只显示证件照；没有证件照时保留同尺寸线框。 */
/* ============================================
   🖼️ 头像占位（无图片时显示文字）
   ============================================ */
.portrait,
.portrait-placeholder {
    flex: 0 0 94px; /* 固定宽度94px，不伸缩 */
}

.portrait-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8b704a;
    font: 10px/1.4 "Arial Narrow", sans-serif;
    letter-spacing: .12em;
    text-align: center;
}


/* ============================================
   📱 移动端适配（屏幕宽度 ≤ 600px）
   ============================================ */
@media (max-width: 600px) {

    /* 容器宽度 */
    .wrap {
        width: min(calc(100% - 24px), 1380px);
    }

    /* 页眉内边距减小 */
    .masthead {
        padding-top: 42px;
    }

    /* 隐藏侧边印章 */
    .seal {
        display: none;
    }

    /* 卡片网格变成单列 */
    .grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    /* 搜索框占满整行 */
    .toolbar input {
        min-width: 100%;
    }

    /* 计数左对齐 */
    .count {
        margin-left: 0;
    }

    /* 信息区块变成单栏 */
    .sections {
        grid-template-columns: 1fr;
    }

    /* 跨栏元素恢复普通宽度 */
    .section.full {
        grid-column: auto;
    }

    /* 卡片内边距缩小 */
    .card-head {
        padding: 18px 18px 12px;
    }
    .card-body {
        padding: 0 18px 18px;
    }
}
/* ============================================
   📜 BACKGROUND NOTE（背景备注）
   ============================================ */
.note-section{margin-top:10px}
.note-text{margin:0;color:var(--muted);font-size:12px;line-height:1.7;
	display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
	word-break:break-word}
.note-section.expanded .note-text{display:block}
.note-empty{color:#7a6a56;font-size:12px;margin:0;font-style:italic}
.note-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.note-btn{background:#171311;border:1px solid var(--line);color:var(--gold);
	font:700 10px/1 "Arial Narrow",sans-serif;letter-spacing:.14em;padding:6px 11px;
	border-radius:2px;cursor:pointer;transition:.25s ease}
.note-btn:hover{background:#2c211d;border-color:var(--gold)}

/* ---------- 阅读文本框 ---------- */
.note-modal{display:none;position:fixed;z-index:8;inset:0;background:#090807ee;
	align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.note-modal.open{display:flex}
.note-modal-box{background:linear-gradient(145deg,#2a211e,#171413);
	border:1px solid #614b3d;box-shadow:0 0 0 1px var(--gold),0 18px 70px #000;
	width:100%;max-width:min(680px,94vw);max-height:82vh;display:flex;
	flex-direction:column;position:relative;cursor:default;animation:rise .35s ease both}
.note-modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);
	display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.note-modal-head h3{margin:0;color:var(--gold);
	font:700 12px/1 "Arial Narrow",sans-serif;letter-spacing:.16em}
.note-modal-head .who{color:var(--ink);font-size:20px}
.note-modal-body{padding:20px 22px 26px;overflow-y:auto;color:#e4d9c6;
	font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.note-modal-body::-webkit-scrollbar{width:8px}
.note-modal-body::-webkit-scrollbar-thumb{background:#5d483b;border-radius:4px}
.note-close{position:absolute;right:10px;top:8px;color:var(--gold);font-size:26px;
	line-height:1;cursor:pointer;background:none;border:none;padding:4px;z-index:1}
.note-close:hover{color:#fff}
</style>
</head>
<body>
<header class="masthead"><div class="wrap"><div class="kicker">16th Spiral Tavern · Archive 01</div><h1>16号螺旋酒馆</h1><div id="loadingIndicator" style="font-size:12px;color:var(--muted);margin-top:4px;">📂 正在加载档案...</div><p>异世界旅客登记簿。每一张档案都保留了原始人物卡作为底稿；页面文字仅做结构化摘录，姓名、数值、涂改与留白均按原件呈现。</p><div class="seal">旅客录</div></div></header>
<main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="搜索姓名、能力、关系……"><select id="seat"><option value="">全部座位</option><option value="A">A 区</option><option value="B">B 区</option><option value="?">未登记</option></select><button id="randomBtn" style="background: #171311d9; border: 1px solid var(--gold); color: var(--gold); padding: 11px 18px; border-radius: 2px; cursor: pointer; font: inherit; transition: 0.3s;">🎲 随机</button><span class="count" id="count"></span></div><div class="note"><strong>档案说明：</strong>红色涂改、问号和空白信息没有被推测或补写。点击人物图可查看对应的原始卡片大图。</div><section class="grid" id="cards"></section></main>
<footer><div class="wrap">资料来源：16号文件夹内人物卡图片与《1泠钰 设定卡.docx》；页面排版为归档展示用途。</div></footer>
<div class="lightbox" id="lightbox"><span class="close">×</span><img id="lightboxImg" alt="原始人物卡"></div>
<div class="note-modal" id="noteModal"><div class="note-modal-box"><button class="note-close" aria-label="关闭">×</button><div class="note-modal-head"><h3>BACKGROUND NOTE</h3><span class="who" id="noteModalName"></span></div><div class="note-modal-body" id="noteModalBody"></div></div></div>
<script>
const CHARACTER_ROOT = '../images/character/';
const ID_ROOT = '../images/ID/';

// 每条档案保留原卡片字段：基础资料、简介、战斗信息、关系和总结。
let people = [];
let isLoading = true;

async function loadPeople() {
  try {
    const response = await fetch('../data/people.json');
    if (!response.ok) throw new Error('网络请求失败');
    people = await response.json();
    isLoading = false;
    document.getElementById('loadingIndicator').textContent = '📂 档案已就绪';
    document.getElementById('loadingIndicator').style.color = 'var(--gold)';
    render();
  } catch (error) {
    console.error('加载人物数据失败:', error);
    document.getElementById('cards').innerHTML = `
      <div class="empty" style="color:#d89878;">
        ⚠️ 档案加载失败，请刷新重试。<br>
        <span style="font-size:12px;color:var(--muted);">${esc(error.message)}</span><br>
        <span style="font-size:12px;color:var(--muted);">提示：请通过本地服务器打开页面（如 VS Code Live Server），直接双击 HTML 会被浏览器拦截本地 JSON 请求。</span>
      </div>`;
    document.getElementById('count').textContent = '加载失败';
    document.getElementById('loadingIndicator').textContent = '📂 档案加载失败';
  }
}

// 用户可见文字统一转义，避免人物资料中的符号影响 HTML 结构。
function esc(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[character]));
}

// 将一条人物资料拆成头部信息、简介和六个既有栏目。
function renderSections(person) {
  const sections = [
    ['WEAKNESS', person.weak],
    ['SKILL', person.skill],
    ['RELATED', person.related],
    ['VALUE SYSTEM', person.value],
    ['SYNTHESIS', person.syn],
    ['CONCLUSION', person.con]
  ];

  return sections
    .map(([title, text], index) => `
      <div class="section ${index === 5 ? 'full' : ''}">
        <h3>${title}</h3>
        <p>${esc(text)}</p>
      </div>`)
    .join('');
}

function card(person, index) {
  const image = `${CHARACTER_ROOT}${encodeURI(person.file)}`;
  const portraitSrc = person.portrait ? `${ID_ROOT}${encodeURI(person.portrait)}` : '';
  const portrait = portraitSrc
    ? `<img class="portrait" src="${portraitSrc}" data-full="${image}" alt="${esc(person.name)}证件照">`
    : '<div class="portrait portrait-placeholder">证件照<br>未登记</div>';

  const detailText = (person.detail || '').trim();
  const longNote = detailText.length > 100;
  const noteContent = detailText
    ? `<p class="note-text">${esc(detailText)}</p>`
    : '<p class="note-empty">（待补充）</p>';
  const noteActions = detailText ? `
    <div class="note-actions">
      ${longNote ? '<button class="note-btn note-toggle" type="button">展开 ▾</button>' : ''}
      <button class="note-btn note-read" type="button">阅读原文 ↗</button>
    </div>` : '';
  const background = `
    <div class="section full note-section" data-name="${esc(person.name)}">
      <h3>BACKGROUND NOTE</h3>
      ${noteContent}
      ${noteActions}
    </div>`;

  return `<article class="card" data-text="${esc(Object.values(person).join(' '))}" data-seat="${esc(person.seat)}" data-name="${esc(person.name)}" style="animation-delay:${index * 40}ms">
    <div class="card-head">
      ${portrait}
      <div>
        <h2>${esc(person.name)}</h2>
        <div class="alias">
          16号螺旋酒馆 · 旅客档案
          <button class="fav-btn" type="button" data-name="${esc(person.name)}" aria-label="收藏${esc(person.name)}">☆</button>
        </div>
        <div class="facts">
          <span>AGE<b>${esc(person.age)}</b></span>
          <span>HEIGHT<b>${esc(person.height)}</b></span>
          <span>WEIGHT<b>${esc(person.weight)}</b></span>
          <span>SEAT<b class="seat">${esc(person.seat)}</b></span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <p class="intro">${esc(person.intro)}</p>
      <div class="sections">${renderSections(person)}</div>
      ${background}
      <a class="source" href="${image}" target="_blank" rel="noreferrer">查看原始卡片 ↗</a>
    </div>
  </article>`;
}

// 搜索与座位筛选共用这一处渲染入口，保持结果数量同步。
function render() {
  if (isLoading) return;

  const query = document.getElementById('search').value.trim().toLowerCase();
  const seat = document.getElementById('seat').value;
  // 第一步：筛选
const filteredPeople = people.filter(person => {
    const matchesQuery = !query || Object.values(person).join(' ').toLowerCase().includes(query);
    const matchesSeat = !seat || (seat === '?' ? person.seat === '未登记' : person.seat.startsWith(seat));
    return matchesQuery && matchesSeat;
});

// 第二步：分离收藏和未收藏
const favorites = getFavorites(); // 获取收藏列表（按收藏顺序）
const favoritePeople = [];
const unfavoritePeople = [];

filteredPeople.forEach(person => {
    if (favorites.includes(person.name)) {
        favoritePeople.push(person);
    } else {
        unfavoritePeople.push(person);
    }
});

// 第三步：收藏卡片按收藏顺序排序（用 favorites 的顺序做索引）
favoritePeople.sort((a, b) => {
    return favorites.indexOf(a.name) - favorites.indexOf(b.name);
});

// 第四步：合并（收藏在前，未收藏在后）
const visiblePeople = [...favoritePeople, ...unfavoritePeople];

  document.getElementById('cards').innerHTML = visiblePeople.length
    ? visiblePeople.map(card).join('')
    : '<div class="empty">没有找到对应的酒客档案。</div>';
  document.getElementById('count').textContent = `${visiblePeople.length} / ${people.length} 位旅客`;
  updateFavoriteUI();
}

const STORAGE_KEY = 'tavern_favorites';

function getFavorites() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? JSON.parse(stored) : [];
  } catch {
    return [];
  }
}

function saveFavorites(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function toggleFavorite(name) {
  const list = getFavorites();
  const index = list.indexOf(name);
  if (index > -1) {
    list.splice(index, 1);
  } else {
    list.push(name);
  }
  saveFavorites(list);
  updateFavoriteUI();
}

function updateFavoriteUI() {
  const favorites = getFavorites();
  document.querySelectorAll('.card').forEach(cardElement => {
    const name = cardElement.dataset.name;
    const isFavorite = favorites.includes(name);
    cardElement.classList.toggle('is-fav', isFavorite);
    const button = cardElement.querySelector('.fav-btn');
    if (button) {
      button.textContent = isFavorite ? '★' : '☆';
      button.classList.toggle('is-fav', isFavorite);
      button.setAttribute('aria-pressed', String(isFavorite));
    }
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('seat').addEventListener('change', render);
document.getElementById('cards').addEventListener('click', event => {
  const button = event.target.closest('.fav-btn');
  if (!button) return;
  event.stopPropagation();
  toggleFavorite(button.dataset.name);
});
// 随机酒客按钮
document.getElementById('randomBtn').addEventListener('click', function() {
  const visibleCards = Array.from(document.querySelectorAll('.card'));

  if (visibleCards.length === 0) {
    // 如果没有可见卡片（全部被筛掉了），提示一下
    alert('当前没有符合条件的酒客。');
    return;
  }

  // 随机选一张
  const randomIndex = Math.floor(Math.random() * visibleCards.length);
  const targetCard = visibleCards[randomIndex];

  // 移除之前的高亮
  document.querySelectorAll('.card.highlight').forEach(card => card.classList.remove('highlight'));

  // 滚动到卡片位置
  targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // 添加高亮
  targetCard.classList.add('highlight');
});
document.getElementById('cards').addEventListener('click', event => {
  const toggle = event.target.closest('.note-toggle');
  if (toggle) {
    const section = toggle.closest('.note-section');
    const expanded = section.classList.toggle('expanded');
    toggle.textContent = expanded ? '收起 ▴' : '展开 ▾';
    return;
  }
  const reader = event.target.closest('.note-read');
  if (reader) {
    const section = reader.closest('.note-section');
    const textEl = section.querySelector('.note-text');
    document.getElementById('noteModalName').textContent = section.dataset.name || '';
    document.getElementById('noteModalBody').textContent = textEl ? textEl.textContent : '';
    document.getElementById('noteModal').classList.add('open');
    return;
  }
  const target = event.target.closest('.portrait');
  if (!target || !target.dataset.full) return;

  document.getElementById('lightboxImg').src = target.dataset.full;
  document.getElementById('lightbox').classList.add('open');
});
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
const noteModal = document.getElementById('noteModal');
noteModal.addEventListener('click', event => {
  if (event.target === noteModal || event.target.closest('.note-close')) {
    noteModal.classList.remove('open');
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') noteModal.classList.remove('open');
});
loadPeople();
</script>
