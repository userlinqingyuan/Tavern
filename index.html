<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="16号螺旋酒馆 · 旅客档案封面">
    <title>16号螺旋酒馆 · 档案室</title>

    <style>
        /* ============================================
                   🎨 颜色变量（全局配色，改这里就行）
                   ============================================ */
        :root {
            --ink: #eadcc0;       /* 文字主色（米白） */
            --muted: #a08d72;     /* 次要文字（灰褐） */
            --amber: #e2a653;     /* 强调色（琥珀金） */
        }

        /* ============================================
                   🧱 基础重置
                   ============================================ */
        * {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
            background: #0c0806;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        
        .bar {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: #0c0806 url('images/bar.jpg') center/cover no-repeat;
            animation: fadein 1.2s ease both;
        }
        @keyframes fadein {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 暗色渐变叠加 */
        .bar::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 3, 2, .48), rgba(5, 3, 2, .16) 42%, rgba(5, 3, 2, .62));
        }
        /* 径向暗角 */
        .bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 90% 78% at 50% 42%, transparent 36%, rgba(0, 0, 0, .72) 100%);
        }

        /* 噪点纹理 */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: .10;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
        }


        /* ============================================
                   📦 档案袋卡片
                   ============================================ */
        .stage {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            padding: 44px 24px;
        }

        /* 光晕（装饰） */
        .halo {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(780px, 95vw);
            height: min(780px, 95vw);
            pointer-events: none;
            background: radial-gradient(circle, rgba(226, 166, 83, .12), rgba(226, 166, 83, .03) 38%, transparent 62%);
            animation: breathe 7s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,
            100% {
                opacity: .8;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        /* --- 档案袋主体 --- */
        .envelope {
            position: relative;
            width: min(430px, 86vw);
            aspect-ratio: 4/5;
            perspective: 1100px;
            filter: drop-shadow(0 30px 44px rgba(0, 0, 0, .62));
            cursor: pointer;
            transition: transform .5s ease;
        }
        .envelope:hover {
            transform: translateY(-5px);
        }
        .envelope:focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: 8px;
            border-radius: 8px;
        }

        /* --- 内层文件（案件卷宗） --- */
        .case-file {
            position: absolute;
            left: 9%;
            right: 9%;
            top: 12%;
            height: 76%;
            z-index: 1;
            overflow: visible;
            transform: translateY(0) rotate(-1deg);
            transform-origin: 50% 100%;
            transition: transform .6s ease-out, filter .6s ease-out;
            filter: drop-shadow(0 14px 12px rgba(0, 0, 0, .35));
        }
        .case-file::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(9, 9, 9, .78);
            border-radius: 2px;
        }
        .case-file::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 15%;
            z-index: 2;
            background: rgba(9, 9, 9, .9);
            pointer-events: none;
        }

        /* --- 文件纸张 --- */
        .document {
            position: absolute;
            left: 13%;
            right: 13%;
            top: 2%;
            height: 62%;
            padding: 7% 7% 0;
            color: #29251f;
            background: linear-gradient(165deg, #e5e1d3, #bcb9ac);
            clip-path: polygon(4% 0, 96% 4%, 100% 100%, 0 94%);
            box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
            font-family: Arial, sans-serif;
            font-weight: 700;
            transform: translateY(0) rotate(2deg);
            transition: transform .6s ease-out;
            z-index: 2;
        }
        .document::before {
            content: "";
            position: absolute;
            left: -1%;
            top: -1%;
            width: 24%;
            height: 22%;
            background: linear-gradient(135deg, #fdf6e3 0 48%, #aaa79d 49% 60%, transparent 61%);
            transform: rotate(-7deg);
            filter: drop-shadow(3px 3px 2px rgba(0, 0, 0, .22));
        }
        .document::after {
            content: "阅后归档 · 16号螺旋酒馆";
            position: absolute;
            right: 8%;
            bottom: 9%;
            color: #8d4a3f;
            font: italic 10px/1.2 "Segoe Print", "KaiTi", cursive;
            transform: rotate(-7deg);
            opacity: .8;
        }
        .document strong {
            display: block;
            font-size: clamp(14px, 3.6vw, 24px);
            letter-spacing: .04em;
        }
        .document small {
            display: block;
            margin-top: 5%;
            font-size: 6px;
            letter-spacing: .08em;
        }
        .document .rule {
            display: block;
            height: 4px;
            margin-top: 9%;
            background: #2a2824;
            box-shadow: 0 14px 0 #d0cdc1, 0 28px 0 #292722;
        }
        .document .closed {
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: 13%;
            padding: 5px 0;
            border-top: 2px solid #25231f;
            border-bottom: 2px solid #25231f;
            text-align: center;
            font-size: clamp(12px, 3vw, 19px);
        }

        /* --- 档案袋封面（外层） --- */
        .archive-cover {
            position: absolute;
            left: 0;
            right: 0;
            top: 25%;
            bottom: -18%;
            z-index: 3;
            border: 1px solid rgba(74, 52, 31, .8);
            background:
                repeating-linear-gradient(108deg, rgba(73, 52, 32, .12) 0 1px, transparent 1px 5px),
                linear-gradient(165deg, #c9a77b, #ad895e 72%, #896744);
            box-shadow:
                inset 0 1px rgba(255, 233, 190, .55),
                inset 0 -12px 20px rgba(55, 34, 18, .28),
                0 5px 8px rgba(0, 0, 0, .38);
            transform: rotate(-1deg);
            transition: transform .35s ease-out;
            pointer-events: none;
        }
        .archive-cover::before {
            content: "";
            position: absolute;
            left: 7%;
            right: 7%;
            top: 11%;
            height: 1px;
            background: rgba(67, 45, 25, .45);
            box-shadow: 0 3px rgba(255, 227, 177, .18);
        }
        .archive-cover::after {
            content: "ARCHIVE · 16";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 23%;
            padding: 7px 4px;
            border: 1px solid rgba(67, 45, 25, .55);
            color: rgba(52, 36, 23, .82);
            text-align: center;
            font: 700 clamp(9px, 2.2vw, 13px)/1.2 Georgia, serif;
            letter-spacing: .2em;
        }

        /* --- 悬停/打开动画 --- */
        .envelope:hover .archive-cover,
        .envelope:focus-visible .archive-cover,
        .envelope.is-open .archive-cover {
            transform: translateY(-6px) rotate(-2deg);
        }
        .envelope:hover .document,
        .envelope:focus-visible .document,
        .envelope.is-open .document {
            transform: translateY(-60px) rotate(2deg);
        }

        /* --- 档案袋底纹 --- */
        .face {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(83, 51, 18, .65);
            border-radius: 8px;
            overflow: hidden;
            background:
                repeating-linear-gradient(90deg, rgba(119, 77, 29, .10) 0 1px, transparent 1px 9px),
                linear-gradient(160deg, #d8b070, #c29553 46%, #ab7c3e 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 236, 200, .55),
                inset 0 -1px 0 rgba(74, 45, 14, .6),
                inset 0 0 0 1px rgba(83, 51, 18, .55);
        }
        .face::before {
            content: "";
            position: absolute;
            left: 6%;
            right: 6%;
            top: 52%;
            height: 48%;
            background: linear-gradient(180deg, rgba(120, 74, 28, .14), transparent 12%, transparent 88%, rgba(120, 74, 28, .12));
        }

        /* --- 档案袋翻盖 --- */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56%;
            z-index: 4;
            transform: rotateX(-48deg);
            transform-origin: 50% 0;
            clip-path: polygon(0 0, 100% 0, 100% 84%, 50% 100%, 0 84%);
            background:
                repeating-linear-gradient(90deg, rgba(119, 77, 29, .08) 0 1px, transparent 1px 9px),
                linear-gradient(165deg, #dcb677, #c0914d 80%);
            border-radius: 8px 8px 0 0;
            box-shadow:
                inset 0 1px 0 rgba(255, 236, 200, .5),
                inset 0 -16px 26px -20px rgba(74, 45, 14, .6);
        }

        /* --- 绳结装饰（SVG） --- */
        .tie {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
        .tie path {
            fill: none;
            stroke: #5d3d1f;
            stroke-width: 4;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
        }

        /* --- 品牌文字（档案袋正面） --- */
        .brand {
            position: absolute;
            left: 0;
            right: 0;
            top: 59.5%;
            text-align: center;
            z-index: 1;
        }
        .brand .sub {
            font-size: 12px;
            letter-spacing: .58em;
            color: #6f4a1e;
            margin-left: .58em;
            text-shadow: 0 1px 0 rgba(255, 238, 205, .4);
        }
        .brand h1 {
            margin: 9px 0 11px;
            font-size: clamp(28px, 5.6vw, 40px);
            color: #3e2410;
            letter-spacing: .1em;
            text-shadow: 0 1px 0 rgba(255, 238, 205, .45);
        }
        .brand .en {
            font: 700 9px/1.4 "Arial Narrow", sans-serif;
            letter-spacing: .32em;
            color: #6f4a1e;
            text-transform: uppercase;
            margin-left: .32em;
        }
        .foot {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            z-index: 1;
            font-size: 10px;
            letter-spacing: .26em;
            color: #6f4a1e;
            margin-left: .26em;
        }


        /* ============================================
                   🚪 入口按钮
                   ============================================ */
        .enter {
            position: relative;
            z-index: 6;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 34px;
            border: 1px solid rgba(234, 220, 192, .42);
            color: var(--ink);
            font-size: 15px;
            letter-spacing: .42em;
            text-indent: .42em;
            border-radius: 2px;
            background: rgba(20, 12, 8, .45);
            backdrop-filter: blur(4px);
            transition: .35s ease;
            transform: translateY(-110px);
        }
        .enter:hover {
            background: rgba(234, 220, 192, .12);
            border-color: var(--ink);
            box-shadow: 0 0 28px rgba(234, 220, 192, .14);
        }
        .enter .arr {
            display: inline-block;
            transition: transform .35s ease;
        }
        .enter:hover .arr {
            transform: translateX(5px);
        }

        /* 悬停入口时联动档案袋动画 */
        .stage:has(.enter:hover) .archive-cover {
            transform: translateY(-6px) rotate(-2deg);
        }
        .stage:has(.enter:hover) .document {
            transform: translateY(-60px) rotate(2deg);
        }

        .caption {
            margin-top: -16px;
            font-size: 11px;
            letter-spacing: .22em;
            color: var(--muted);
            text-align: center;
        }


        /* ============================================
                   📱 移动端适配
                   ============================================ */
        @media(max-width:620px) {
            .stage {
                gap: 22px;
                padding: 36px 20px;
            }
            .envelope {
                width: min(340px, 84vw);
            }
            .counter {
                height: 16vh;
            }
        }

        /* 减少动画（辅助功能） */
        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- ============================================
    🎬 页面结构
    ============================================ -->

    <!-- 背景图 -->
    <div class="bar" aria-hidden="true"></div>
    <!-- 噪点 -->
    <div class="grain" aria-hidden="true"></div>

    <main class="stage">
        <!-- 光晕 -->
        <div class="halo" aria-hidden="true"></div>

        <!-- ============================================
        📦 档案袋（点击可展开）
        ============================================ -->
        <div class="envelope" tabindex="0" role="button" aria-expanded="false" aria-label="展开旅客档案封面">

            <!-- 内层文件 -->
            <div class="case-file" aria-hidden="true">
                <div class="document">
                    <strong>BAR-00016</strong>
                    <small>INTERVIEW QUESTIONNAIRE · FIELD REPORT</small>
                    <span class="rule"></span>
                    <div class="closed">CASE FILE CLOSED</div>
                </div>
                <div class="archive-cover"></div>
            </div>

        </div>

        <!-- ============================================
        🚪 入口按钮（跳转到 /drinker/）
        ============================================ -->
        <a class="enter" href="drinker/">
            打 开 档 案
            <span class="arr">→</span>
        </a>

        <p class="caption">16号螺旋酒馆 · 旅客档案</p>
    </main>

    <!-- ============================================
    📜 JavaScript：点击档案袋切换 .is-open
    ============================================ -->
    <script>
        const envelope = document.querySelector('.envelope');
        envelope.addEventListener('click', () => {
            const isOpen = envelope.classList.toggle('is-open');
            envelope.setAttribute('aria-expanded', String(isOpen));
        });
        envelope.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            envelope.click();
        });
    </script>
</body>
</html>
