<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="16号螺旋酒馆">
    <title>16号螺旋酒馆</title>

    <link rel="stylesheet" href="css/tavern.css?v=v2.3.0">
    <style>
        /* 琥珀金为封面专属强调色，其余颜色变量/滚动条见 css/tavern.css */
        :root {
            --amber: #e2a653;
            /* 首页照片不走共享的 --page-photo（那条相对路径会按 css/ 解析成 404），
               直接在本页覆盖 html 背景，见下方 html 规则 */
        }

        /* ============================================
                   🧱 基础重置
                   ============================================ */
        /* 首页画布背景：照片钉在屏幕上（不随内容滚），等比铺满后裁掉多余部分，不变形。
           放在 html 画布层是因为 body 上会被 ambient 模块加 filter，
           那样 body 内部的 position:fixed 会失效、跟着滚动。 */
        html {
            background-color: var(--page-base);
            background-image: var(--page-dim), var(--page-vignette), url('images/bar.jpg');
            background-position: center;
            background-size: cover, cover, cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
            /* 背景照片与暗化/暗角由 css/tavern.css 的 html 背景层统一提供 */
            background: transparent;
        }
        a { color: inherit; text-decoration: none; }

        /* ============================================
                   🚪 星系开场动画（推门入场）
                   ============================================ */
        .door-scene {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            overflow: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .door-scene.opened {
            opacity: 0;
            visibility: hidden;
        }
        #galaxyCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .door-skip {
            position: absolute;
            bottom: 7%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180,160,130,0.4);
            font-size: 11px;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 101;
            transition: color 0.3s ease;
        }
        .door-skip:hover { color: rgba(220,200,160,0.7); }

        /* ============================================
                   🏛️ 酒馆内景
                   ============================================ */
        .interior { position: relative; min-height: 100vh; }

        /* 噪点纹理 */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: .10;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
        }

        /* 浮尘粒子 */
        .dust-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .dust {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, rgba(255, 220, 160, 0.5), rgba(255, 200, 150, 0.1) 60%, transparent);
            opacity: 0;
            animation: dustFloat var(--duration, 12s) ease-in-out infinite alternate;
            animation-delay: var(--delay, 0s);
            width: var(--size, 6px);
            height: var(--size, 6px);
            left: var(--x, 10%);
            top: var(--y, 20%);
        }
        .dust-1 { --x: 12%; --y: 25%; --size: 5px; --duration: 14s; --delay: 0s; --tx: 60px; --ty: -100px; }
        .dust-2 { --x: 78%; --y: 18%; --size: 8px; --duration: 18s; --delay: 2s; --tx: -80px; --ty: -140px; }
        .dust-3 { --x: 45%; --y: 55%; --size: 4px; --duration: 13s; --delay: 4s; --tx: 100px; --ty: -80px; }
        .dust-4 { --x: 92%; --y: 70%; --size: 6px; --duration: 20s; --delay: 1s; --tx: -50px; --ty: -160px; }
        .dust-5 { --x: 8%; --y: 80%; --size: 7px; --duration: 16s; --delay: 3s; --tx: 70px; --ty: -110px; }
        .dust-6 { --x: 60%; --y: 12%; --size: 4px; --duration: 15s; --delay: 5s; --tx: -90px; --ty: -130px; }
        @keyframes dustFloat {
            0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
            15% { opacity: 0.4; }
            50% { opacity: 0.6; }
            85% { opacity: 0.3; }
            100% { opacity: 0; transform: translate(var(--tx, 80px), var(--ty, -120px)) scale(1.2); }
        }

        /* ============================================
                   📦 内容容器
                   ============================================ */
        .content {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding: 56px 36px 40px;
            opacity: 0;
            transition: opacity 0.9s ease 0.25s;
        }
        .content.show { opacity: 1; }

        /* 品牌区 */
        .brand-hero {
            text-align: center;
            margin-bottom: 48px;
            animation: slideInLeft 0.9s cubic-bezier(0.2,0.8,0.2,1) both;
        }
        .brand-hero h1 {
            font-size: clamp(34px, 6vw, 62px);
            color: var(--gold);
            letter-spacing: 0.14em;
            margin: 0 0 10px;
            font-weight: 400;
            text-shadow: 0 2px 24px rgba(214,168,93,0.32);
        }
        .brand-hero .subtitle {
            font-size: 11px;
            letter-spacing: 0.52em;
            color: var(--muted);
            text-transform: uppercase;
            margin-left: 0.52em;
        }
        .brand-hero .welcome {
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
            font-style: italic;
            letter-spacing: 0.06em;
            min-height: 20px;
            opacity: 0.8;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-28px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 主区域：九宫格 + 手记 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            align-items: stretch;   /* 左右两列等高，右侧整列底部与九宫格对齐 */
        }

        /* 功能九宫格 */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 行高可随右侧手记栏拉高，保证左侧卡片底部与右侧整列底部对齐 */
            grid-auto-rows: minmax(110px, 1fr);
            gap: 14px;
        }
        .portal-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 22px 14px;
            background: rgba(20,12,8,0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(214,168,93,0.18);
            border-radius: 10px;
            color: var(--ink);
            /* 手机倾斜时朝重力方向微微倾斜（--tilt 由 tavern-ambient.js 写入） */
            transform: rotate(var(--tilt, 0deg));
            transition: transform 0.18s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }
        .portal-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(214,168,93,0.1), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .portal-card:hover,
        .portal-card:focus-visible {
            border-color: rgba(214,168,93,0.5);
            transform: translateY(-4px) rotate(var(--tilt, 0deg));
            box-shadow: 0 14px 34px rgba(0,0,0,0.55);
            outline: none;
        }
        .portal-card:hover::before,
        .portal-card:focus-visible::before { opacity: 1; }
        .portal-card .icon {
            font-size: 30px;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }
        .portal-card:hover .icon { transform: scale(1.12); }
        .portal-card .title {
            font-size: 15px;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 3px;
        }
        .portal-card .desc {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
        /* 主入口：酒客档案 */
        .portal-card.primary {
            grid-row: span 2;
            grid-column: 2;
            background: linear-gradient(160deg, rgba(214,168,93,0.14), rgba(20,12,8,0.65));
            border-color: rgba(214,168,93,0.38);
        }
        .portal-card.primary .icon { font-size: 52px; }
        .portal-card.primary .title { font-size: 20px; }
        .portal-card.primary .desc { font-size: 12px; }

        /* 手记栏：手记在上、借阅记录紧随其下，同宽同栏 */
        .note-wrap {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideInRight 0.9s cubic-bezier(0.2,0.8,0.2,1) 0.15s both;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(28px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 借阅记录：撑满手记下方的剩余高度，列表随之拉长 */
        .borrow-section {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            animation: fadeInUp 0.8s ease 0.35s both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
                   🔥 壁炉火焰（首页已停用 · 代码保留备用）
                   ============================================ */

        /* ============================================
                   📱 移动端适配
                   ============================================ */
        @media (max-width: 620px) {
            .door-scene { display: none; }
            .content {
                opacity: 1;
                padding: 30px 16px 120px;
            }
            .main-grid { grid-template-columns: 1fr; }
            .note-wrap { position: static; }
            /* 移动端背景换成压缩过的小图（原图 3MB，整张解码是滚动卡顿的大头） */
            .interior {
                background-image: var(--page-dim), var(--page-vignette), url('images/bar-sm.jpg');
            }
            /* 移动端：九宫格改成横向滑动的页面卡（吸附对齐 + 可见的细滚动条） */
            .portal-grid {
                display: flex;
                gap: 12px;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                padding: 2px 2px 12px;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
                scrollbar-width: thin;
                scrollbar-color: rgba(200,168,120,.45) rgba(72,50,28,.25);
            }
            .portal-grid::-webkit-scrollbar { height: 6px; }
            .portal-grid::-webkit-scrollbar-track { background: rgba(72,50,28,.25); border-radius: 3px; }
            .portal-grid::-webkit-scrollbar-thumb { background: rgba(200,168,120,.5); border-radius: 3px; }
            .portal-card,
            .portal-card.primary {
                flex: 0 0 min(68vw, 240px);
                scroll-snap-align: center;
                padding: 18px 14px;
                min-height: 126px;
            }
            .portal-card.primary .icon { font-size: 40px; }
            .portal-card.primary .title { font-size: 17px; }
            /* .fireplace 首页已停用（2026-09-13）：
            .fireplace {
                transform: scale(0.55);
                bottom: 12px;
                right: 8px;
                opacity: 0.3;
            }
            */
            .dust-3, .dust-5, .dust-6 { display: none; }
        }

        /* 减少动画（辅助功能） */
        @media (prefers-reduced-motion: reduce) {
            .content { transition: none; }
            * { animation: none !important; }
        }

        #fragment-trigger:hover {
            background: var(--gold);
            color: #171311;
            border-color: var(--gold);
        }

        /* ============================================
                   🧊 首页玻璃 UI
                   （玻璃配方 .glass 已收进 css/tavern.css，与页脚短条共用）
                   ============================================ */
        /* 需要给折射层做定位的元素（.portal-card / .tavern-note-card 自带 relative，.door-skip 自带 absolute） */
        .borrow-section.glass,
        #fragment-trigger.glass,
        .tavern-frag-badge.glass { position: relative; }
        /* 跳过按钮改成小玻璃胶囊 */
        .door-skip.glass {
            padding: 9px 22px;
            border-radius: 999px;
            color: rgba(200,180,150,.55);
        }
        .door-skip.glass:hover { color: rgba(226,208,170,.9); }

        /* 借阅记录列表滚动条：与全站同一套皮肤（内联样式写不了伪元素） */
        #borrow-list {
            scrollbar-width: thin;
            scrollbar-color: rgba(200,168,120,.45) rgba(72,50,28,.25);
            overscroll-behavior: contain;
        }
        #borrow-list::-webkit-scrollbar { width: 7px; }
        #borrow-list::-webkit-scrollbar-track { background: rgba(72,50,28,.25); border-radius: 4px; }
        #borrow-list::-webkit-scrollbar-thumb { background: rgba(200,168,120,.5); border-radius: 4px; }
        #borrow-list::-webkit-scrollbar-thumb:hover { background: rgba(214,168,93,.7); }
    </style>
</head>

<body>
    <!-- ============================================
    🚪 门场景（PC 端推门入场）
    ============================================ -->
    <div class="door-scene" id="doorScene" aria-label="螺旋星系开场动画">
        <canvas id="galaxyCanvas"></canvas>
        <button class="door-skip glass" id="doorSkip" type="button">跳 过</button>
    </div>

    <!-- ============================================
    🏛️ 酒馆内景
    ============================================ -->
    <div class="interior">
        <div class="grain" aria-hidden="true"></div>
        <div class="dust-container" aria-hidden="true">
            <div class="dust dust-1"></div>
            <div class="dust dust-2"></div>
            <div class="dust dust-3"></div>
            <div class="dust dust-4"></div>
            <div class="dust dust-5"></div>
            <div class="dust dust-6"></div>
        </div>

        <main class="content" id="content">
            <!-- 品牌区 -->
            <header class="brand-hero">
                <h1>16号螺旋酒馆</h1>
                <div class="subtitle">TAVERN NO.16 SPIRAL</div>
                <div class="welcome" id="welcome"></div>
                <!-- 🌙 环境感知：季节欢迎语（由 tavern-core.js 的 Ambient 填充） -->
                <div id="greeting"></div>
            </header>

            <!-- 🎉 节日/节气卡片：tavern-ambient.js 命中公历节日时显示，平时 display:none -->
            <div id="festivalCard" role="status"></div>

            <!-- 主区域：九宫格 + 手记 -->
            <div class="main-grid">
                <div class="portal-grid">
                    <a class="portal-card glass" href="menu/" tabindex="0">
                        <span class="icon">🍺</span>
                        <span class="title">酒单</span>
                        <span class="desc">今日特供</span>
                    </a>
                    <a class="portal-card glass" href="bar/" tabindex="0">
                        <span class="icon">🍸</span>
                        <span class="title">吧台</span>
                        <span class="desc">调酒与骰子</span>
                    </a>
                    <a class="portal-card glass" href="achievements/" tabindex="0">
                        <span class="icon">🏆</span>
                        <span class="title">成就</span>
                        <span class="desc">酒馆荣誉</span>
                    </a>
                    <a class="portal-card primary glass" href="drinker/" tabindex="0">
                        <span class="icon">📖</span>
                        <span class="title">酒客档案</span>
                        <span class="desc">推开第一扇门</span>
                    </a>
                    <a class="portal-card glass" href="timeline/" tabindex="0">
                        <span class="icon">🕰️</span>
                        <span class="title">时间线</span>
                        <span class="desc">往事回顾</span>
                    </a>
                    <a class="portal-card glass" href="map/" tabindex="0">
                        <span class="icon">🗺️</span>
                        <span class="title">地图</span>
                        <span class="desc">酒馆布局</span>
                    </a>
                </div>

                <!-- 今日手记 + 借阅记录：同一栏，宽度一致，整列底部与左侧九宫格对齐 -->
                <aside class="note-wrap">
                    <!-- 🔮 每日运势签：tavern-ambient.js 渲染签筒，抽过当天则直接显示签文 -->
                    <div id="fortuneBox"></div>

                    <div id="today-note" class="tavern-note-card glass">
                        <div class="note-head">
                            <span class="note-title">📖 今日手记</span>
                            <button id="note-past" class="note-past">往期 ✎</button>
                        </div>
                        <div id="note-text" class="note-text"></div>
                        <!-- 🌕 满月事件：满月夜由 Ambient 追加一条（平时 display:none） -->
                        <div id="moonEvent" role="status"></div>
                    </div>

                    <!-- 借阅记录 -->
                    <section class="borrow-section glass" id="borrow-log" style="
                        width: 100%;
                        padding: 16px 20px 20px;
                        border-radius: 10px;
                    ">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                            <h3 style="margin:0;color:var(--gold);font-weight:400;font-size:14px;letter-spacing:0.08em;">📚 档案借阅记录</h3>
                            <span id="borrow-count" style="color:var(--gold);font-size:11px;opacity:0.6;"></span>
                        </div>
                        <div id="borrow-list" style="
                            flex:1 1 auto;
                            min-height:96px;
                            overflow-y:auto;
                            font-size:13px;
                            line-height:1.6;
                            padding-right:4px;
                        ">
                            <div style="color:var(--gold);font-size:12px;text-align:center;padding:12px 0;opacity:0.4;">暂无借阅记录。</div>
                        </div>
                        <div style="text-align:right;margin-top:8px;">
                            <button id="borrow-clear" style="
                                background:none;border:none;
                                color:rgba(214,168,93,0.25);
                                font-size:11px;cursor:pointer;
                                transition:0.3s;padding:2px 6px;
                            ">清空记录</button>
                        </div>
                    </section>
                </aside>
            </div>
        </main>

        <!-- 壁炉火焰 -->
        <!-- 🔥 壁炉火焰：首页已停用（2026-09-13），代码保留备用，恢复时去掉这对注释标记即可
        <div class="fireplace" aria-hidden="true">
            <div class="flame-container">
                <div class="flame flame-1"></div>
                <div class="flame flame-2"></div>
                <div class="flame flame-3"></div>
                <div class="flame flame-4"></div>
                <div class="flame flame-5"></div>
                <div class="glow"></div>
            </div>
            <div class="log"></div>
        </div>
        -->
    </div>

    <!-- 随机碎片触发器 + 碎片集徽标 -->
    <div id="fragment-dock" style="
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    ">
        <button id="fragment-trigger" class="glass" style="
            color: var(--gold);
            padding: 10px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.06em;
            transition: 0.3s;
            font-family: inherit;
        ">📜 随机碎片</button>
        <button id="fragment-collection" class="tavern-frag-badge glass" style="display:none;" title="查看碎片集">✦ <span id="frag-count">0</span>/6</button>
    </div>

    <!-- 碎片弹窗由 tavern-core.js 统一注入 -->

    <script src="js/tavern-core.js?v=v2.3.0"></script>
    <script src="js/tavern-ambient.js?v=v2.3.0"></script>
    <script>
        // 到访统计 + 成就系统（根目录页 rootPath 传 ''）
        if (window.Tavern) Tavern.init('');

        /* ============================================
           🚪 螺旋星系开场动画
           ============================================ */
        const doorScene = document.getElementById('doorScene');
        const content = document.getElementById('content');
        const doorSkip = document.getElementById('doorSkip');
        const galaxyCanvas = document.getElementById('galaxyCanvas');

        // 移动端直接进内景；二次访问也直接进
        const isMobile = window.matchMedia('(max-width: 620px)').matches;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let visited = false;
        try { visited = localStorage.getItem('tavern_door_opened') === '1'; } catch (e) {}

        function enterTavern() {
            try { localStorage.setItem('tavern_door_opened', '1'); } catch (e) {}
            doorScene.classList.add('opened');
            content.classList.add('show');
            setTimeout(function () { doorScene.style.display = 'none'; }, 800);
        }

        if (isMobile || visited || reduceMotion) {
            content.classList.add('show');
            doorScene.style.display = 'none';
        } else {
            // --- 螺旋星系粒子动画 ---
            const gctx = galaxyCanvas.getContext('2d');
            let GW, GH, GCX, GCY, GMAX_R;

            function galaxyResize() {
                GW = galaxyCanvas.width = window.innerWidth;
                GH = galaxyCanvas.height = window.innerHeight;
                GCX = GW / 2;
                GCY = GH / 2;
                GMAX_R = GW * 0.42;
            }
            galaxyResize();
            window.addEventListener('resize', galaxyResize);

            const NUM_ARMS = 2;
            const PER_ARM = 32;
            const ARM_SPARKLE_COUNT = 40;
            const STARDUST_COUNT = 80;
            const T_HOLD_START = 700;
            const T_DURATION = 1400;
            const T_HOLD_END = 400;
            const SPIRAL_THETA_MAX = Math.PI * 1.8;

            let gParticles = [], gSparkles = [], gStardust = [];
            let galaxyDone = false;

            function initGalaxy() {
                gParticles = []; gSparkles = []; gStardust = [];

                for (let arm = 0; arm < NUM_ARMS; arm++) {
                    const armOffset = (Math.PI * 2 / NUM_ARMS) * arm;
                    for (let i = 0; i < PER_ARM; i++) {
                        const t = i / (PER_ARM - 1);
                        const ft = Math.pow(t, 0.5);
                        const theta = ft * SPIRAL_THETA_MAX;
                        const rStart = GMAX_R * (0.80 - ft * 0.75);
                        const angle = armOffset + theta;
                        const lateral = (Math.random() - 0.5) * GMAX_R * 0.012;
                        gParticles.push({
                            baseR: rStart, baseA: angle, armOffset: armOffset,
                            baseTheta: theta, lateral: lateral,
                            r: rStart, a: angle, trail: [],
                            size: (0.6 + Math.random() * 0.4) * (1.2 - ft * 0.3),
                            bright: 0.28 + Math.random() * 0.20,
                            delay: ft * 0.03 + Math.random() * 0.03,
                            colorVar: Math.random(),
                        });
                    }
                    for (let i = 0; i < ARM_SPARKLE_COUNT; i++) {
                        const t = Math.random();
                        const ft = Math.pow(t, 0.5);
                        const theta = ft * SPIRAL_THETA_MAX;
                        const rStart = GMAX_R * (0.80 - ft * 0.75);
                        const angle = armOffset + theta;
                        const sideOffset = (Math.random() - 0.5) * GMAX_R * 0.06;
                        gSparkles.push({
                            baseR: rStart, baseA: angle, armOffset: armOffset,
                            baseTheta: theta, lateral: sideOffset,
                            r: rStart, a: angle,
                            size: 0.3 + Math.random() * 0.4,
                            bright: 0.10 + Math.random() * 0.15,
                            twinkle: Math.random() * Math.PI * 2,
                            twinkleSpeed: 1.0 + Math.random() * 2.5,
                            delay: ft * 0.03 + Math.random() * 0.04,
                            colorVar: Math.random(),
                        });
                    }
                }
                for (let i = 0; i < STARDUST_COUNT; i++) {
                    gStardust.push({
                        x: (Math.random() - 0.5) * GW * 1.2,
                        y: (Math.random() - 0.5) * GH * 1.2,
                        size: 0.3 + Math.random() * 0.6,
                        bright: 0.08 + Math.random() * 0.12,
                        twinkle: Math.random() * Math.PI * 2,
                        twinkleSpeed: 0.5 + Math.random() * 1.5,
                    });
                }
            }

            function particleColor(cv, progress) {
                let r, g, b;
                if (cv < 0.5) {
                    const t = cv / 0.5;
                    r = 255; g = 245 - t * 15; b = 220 - t * 50;
                } else {
                    const t = (cv - 0.5) / 0.5;
                    r = 255 - t * 25; g = 230 - t * 50; b = 170 - t * 70;
                }
                if (progress > 0.7) {
                    const wt = (progress - 0.7) / 0.3;
                    r = r + (255 - r) * wt * 0.4;
                    g = g + (250 - g) * wt * 0.35;
                    b = b + (220 - b) * wt * 0.30;
                }
                return [Math.round(r), Math.round(g), Math.round(b)];
            }

            function smoothstep(t) { return t * t * (3 - 2 * t); }
            function ultraSoft(t) { return smoothstep(smoothstep(t)); }

            let gStartTime = 0;

            function galaxyFrame(ts) {
                if (galaxyDone) return;
                if (!gStartTime) gStartTime = ts;
                let elapsed = ts - gStartTime;

                if (elapsed >= T_HOLD_START + T_DURATION + T_HOLD_END) {
                    galaxyDone = true;
                    enterTavern();
                    return;
                }

                let phase, prog;
                if (elapsed < T_HOLD_START) { phase = 'show'; prog = 0; }
                else { phase = 'collapse'; prog = Math.min(1, (elapsed - T_HOLD_START) / T_DURATION); }

                const cp = ultraSoft(prog);
                const sp = smoothstep(prog);

                let rotSpeed, shrink, trailLen, camZ, coreGlow, darkness, ringAlpha, ringPulse;

                if (phase === 'show') {
                    rotSpeed = 0.00030; shrink = 1; trailLen = 5; camZ = 1.0;
                    coreGlow = 0; darkness = 0;
                    ringAlpha = 0.15 + 0.05 * Math.sin(elapsed * 0.003);
                    ringPulse = 1 + 0.02 * Math.sin(elapsed * 0.002);
                } else {
                    rotSpeed = 0.0005 + cp * 0.006;
                    shrink = 1 - cp * 0.98;
                    trailLen = 5 + cp * 14;
                    camZ = 1.0 + sp * 0.35;
                    if (prog < 0.60) coreGlow = 0;
                    else if (prog < 0.88) coreGlow = ultraSoft((prog - 0.60) / 0.28) * 0.25;
                    else if (prog < 0.96) coreGlow = 0.25 + (prog - 0.88) / 0.08 * 0.15;
                    else {
                        const p = (prog - 0.96) / 0.04;
                        coreGlow = 0.40 * (1 - p) + 0.01 * Math.sin(p * Math.PI * 3);
                    }
                    darkness = prog > 0.96 ? (prog - 0.96) / 0.04 * 0.65 : 0;
                    ringAlpha = (0.15 + 0.05 * Math.sin(elapsed * 0.003)) * (1 - cp * 0.8);
                    ringPulse = 1 + 0.02 * Math.sin(elapsed * 0.002);
                }

                let fadeAlpha;
                if (phase === 'show') fadeAlpha = 0.12;
                else if (prog < 0.88) fadeAlpha = 0.06 - cp * 0.03;
                else fadeAlpha = 0.10;

                gctx.fillStyle = 'rgba(4,3,2,' + fadeAlpha + ')';
                gctx.fillRect(0, 0, GW, GH);

                // 背景星尘
                for (let i = 0; i < gStardust.length; i++) {
                    const s = gStardust[i];
                    s.twinkle += 0.02 * s.twinkleSpeed;
                    const tw = 0.5 + 0.5 * Math.sin(s.twinkle);
                    const alpha = s.bright * tw * (phase === 'show' ? 1 : (1 - cp * 0.5));
                    if (alpha > 0.01) {
                        gctx.fillStyle = 'rgba(230,220,200,' + alpha + ')';
                        gctx.beginPath();
                        gctx.arc(s.x + GCX, s.y + GCY, s.size, 0, Math.PI * 2);
                        gctx.fill();
                    }
                }

                gctx.save();
                gctx.translate(GCX, GCY);
                gctx.scale(camZ, camZ);

                // 圆环
                if (ringAlpha > 0.01) {
                    const ringR = GMAX_R * 0.85 * ringPulse;
                    gctx.beginPath();
                    gctx.arc(0, 0, ringR, 0, Math.PI * 2);
                    gctx.strokeStyle = 'rgba(255,240,200,' + (ringAlpha * 0.3) + ')';
                    gctx.lineWidth = 8;
                    gctx.stroke();
                    gctx.beginPath();
                    gctx.arc(0, 0, ringR, 0, Math.PI * 2);
                    gctx.strokeStyle = 'rgba(255,245,220,' + ringAlpha + ')';
                    gctx.lineWidth = 1.5;
                    gctx.stroke();
                    gctx.beginPath();
                    gctx.arc(0, 0, ringR * 0.98, 0, Math.PI * 2);
                    gctx.strokeStyle = 'rgba(255,255,240,' + (ringAlpha * 0.5) + ')';
                    gctx.lineWidth = 0.5;
                    gctx.stroke();
                }

                // 臂光带
                if (shrink > 0.02) {
                    for (let arm = 0; arm < NUM_ARMS; arm++) {
                        const firstIdx = arm * PER_ARM;
                        if (firstIdx >= gParticles.length) continue;
                        const firstPt = gParticles[firstIdx];
                        const armRot = firstPt.a - firstPt.baseA;
                        const armOffset = (Math.PI * 2 / NUM_ARMS) * arm + armRot;
                        gctx.beginPath();
                        const steps = 60;
                        for (let s = 0; s <= steps; s++) {
                            const theta = (s / steps) * SPIRAL_THETA_MAX;
                            const r = GMAX_R * (0.80 - (theta / SPIRAL_THETA_MAX) * 0.75) * shrink;
                            const angle = armOffset + theta;
                            const x = Math.cos(angle) * r;
                            const y = Math.sin(angle) * r;
                            if (s === 0) gctx.moveTo(x, y);
                            else gctx.lineTo(x, y);
                        }
                        const glowAlpha = phase === 'show' ? 0.12 : 0.10 * (1 - cp * 0.5);
                        gctx.strokeStyle = 'rgba(200,180,140,' + (glowAlpha * 0.6) + ')';
                        gctx.lineWidth = 6; gctx.lineCap = 'round';
                        gctx.stroke();
                        gctx.strokeStyle = 'rgba(240,225,180,' + (glowAlpha * 0.5) + ')';
                        gctx.lineWidth = 2.5; gctx.stroke();
                        gctx.strokeStyle = 'rgba(255,250,230,' + (glowAlpha * 0.6) + ')';
                        gctx.lineWidth = 0.8; gctx.stroke();
                    }
                }

                // 臂两侧散粒
                for (let i = 0; i < gSparkles.length; i++) {
                    const sp = gSparkles[i];
                    if (phase === 'show') { sp.a += rotSpeed * 16; sp.r = sp.baseR; }
                    else {
                        const indP = Math.max(0, Math.min(1, (prog - sp.delay) / (1 - sp.delay)));
                        const indCp = ultraSoft(indP);
                        if (prog < 0.96) { sp.a += rotSpeed * 16; sp.r = sp.baseR * Math.max(0, 1 - indCp * 0.98); }
                        else { sp.r = 0; }
                    }
                    const px = Math.cos(sp.a) * sp.r + Math.cos(sp.a + Math.PI / 2) * sp.lateral;
                    const py = Math.sin(sp.a) * sp.r + Math.sin(sp.a + Math.PI / 2) * sp.lateral;
                    sp.twinkle += 0.03 * sp.twinkleSpeed;
                    const tw = 0.4 + 0.6 * Math.sin(sp.twinkle);
                    const visAlpha = phase === 'show' ? 1 : (1 - cp * 0.7);
                    const alpha = sp.bright * tw * visAlpha;
                    if (alpha > 0.01 && sp.r > 0.5) {
                        const cc = particleColor(sp.colorVar, prog);
                        const glow = sp.size * 1.5;
                        const grad = gctx.createRadialGradient(px, py, 0, px, py, Math.max(0.5, glow));
                        grad.addColorStop(0, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + alpha + ')');
                        grad.addColorStop(0.4, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (alpha * 0.3) + ')');
                        grad.addColorStop(1, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',0)');
                        gctx.fillStyle = grad;
                        gctx.beginPath();
                        gctx.arc(px, py, Math.max(0.5, glow), 0, Math.PI * 2);
                        gctx.fill();
                    }
                }

                // 主粒子
                for (let i = 0; i < gParticles.length; i++) {
                    const pt = gParticles[i];
                    if (phase === 'show') { pt.a += rotSpeed * 16; pt.r = pt.baseR; }
                    else {
                        const indP = Math.max(0, Math.min(1, (prog - pt.delay) / (1 - pt.delay)));
                        const indCp = ultraSoft(indP);
                        if (prog < 0.96) { pt.a += rotSpeed * 16; pt.r = pt.baseR * Math.max(0, 1 - indCp * 0.98); }
                        else { pt.r = 0; }
                    }
                    const px = Math.cos(pt.a) * pt.r + Math.cos(pt.a + Math.PI / 2) * pt.lateral;
                    const py = Math.sin(pt.a) * pt.r + Math.sin(pt.a + Math.PI / 2) * pt.lateral;
                    pt.trail.push({ x: px, y: py });
                    const maxT = Math.floor(trailLen);
                    if (pt.trail.length > maxT) pt.trail.shift();
                    const cc = particleColor(pt.colorVar, prog);
                    const alpha = pt.bright;
                    if (pt.trail.length > 2 && maxT > 2) {
                        gctx.beginPath();
                        gctx.moveTo(pt.trail[0].x, pt.trail[0].y);
                        for (let j = 1; j < pt.trail.length; j++) gctx.lineTo(pt.trail[j].x, pt.trail[j].y);
                        gctx.strokeStyle = 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (alpha * 0.16) + ')';
                        gctx.lineWidth = pt.size * 0.5; gctx.lineCap = 'round'; gctx.lineJoin = 'round';
                        gctx.stroke();
                    }
                    const glow = pt.size * (phase === 'show' ? 1.0 : 1.0 + cp * 0.6);
                    const grad = gctx.createRadialGradient(px, py, 0, px, py, Math.max(0.5, glow));
                    grad.addColorStop(0, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + alpha + ')');
                    grad.addColorStop(0.35, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (alpha * 0.4) + ')');
                    grad.addColorStop(1, 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',0)');
                    gctx.fillStyle = grad;
                    gctx.beginPath();
                    gctx.arc(px, py, Math.max(0.5, glow), 0, Math.PI * 2);
                    gctx.fill();
                }

                // 中心核心
                if (coreGlow > 0.01) {
                    const coreR = Math.max(1, 2 + coreGlow * 25);
                    const cg2 = gctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
                    if (prog > 0.88) {
                        cg2.addColorStop(0, 'rgba(255,252,235,' + (coreGlow * 0.7) + ')');
                        cg2.addColorStop(0.2, 'rgba(255,240,200,' + (coreGlow * 0.5) + ')');
                        cg2.addColorStop(0.5, 'rgba(220,190,120,' + (coreGlow * 0.25) + ')');
                        cg2.addColorStop(1, 'rgba(100,70,30,0)');
                    } else {
                        cg2.addColorStop(0, 'rgba(245,235,200,' + (coreGlow * 0.5) + ')');
                        cg2.addColorStop(0.3, 'rgba(220,190,120,' + (coreGlow * 0.25) + ')');
                        cg2.addColorStop(1, 'rgba(80,55,20,0)');
                    }
                    gctx.fillStyle = cg2;
                    gctx.beginPath();
                    gctx.arc(0, 0, coreR, 0, Math.PI * 2);
                    gctx.fill();
                }

                gctx.restore();

                if (darkness > 0) {
                    gctx.fillStyle = 'rgba(2,1,1,' + darkness + ')';
                    gctx.fillRect(0, 0, GW, GH);
                    if (coreGlow > 0.01) {
                        const pr = 2 + coreGlow * 5;
                        const pg = gctx.createRadialGradient(GCX, GCY, 0, GCX, GCY, pr);
                        pg.addColorStop(0, 'rgba(255,240,200,' + (coreGlow * 0.3) + ')');
                        pg.addColorStop(0.5, 'rgba(220,190,120,' + (coreGlow * 0.12) + ')');
                        pg.addColorStop(1, 'rgba(80,55,20,0)');
                        gctx.fillStyle = pg;
                        gctx.beginPath();
                        gctx.arc(GCX, GCY, pr, 0, Math.PI * 2);
                        gctx.fill();
                    }
                }

                const vg = gctx.createRadialGradient(GCX, GCY, GW * 0.15, GCX, GCY, GW * 0.65);
                vg.addColorStop(0, 'rgba(0,0,0,0)');
                vg.addColorStop(1, 'rgba(6,4,2,0.75)');
                gctx.fillStyle = vg;
                gctx.fillRect(0, 0, GW, GH);

                requestAnimationFrame(galaxyFrame);
            }

            initGalaxy();
            requestAnimationFrame(galaxyFrame);

            // 跳过按钮
            doorSkip.addEventListener('click', function () {
                galaxyDone = true;
                enterTavern();
            });
        }

        /* ============================================
           💬 欢迎语
           ============================================ */
        const welcomeMessages = [
            "你推门时，风铃响了三声。",
            "柜台上有半杯没人认领的麦酒。",
            "今晚的酒馆比往常安静。",
            "壁炉里的火刚添过新柴。",
            "有人在你之前来过，留下了一张字条。",
            "吧台后面的影子动了一下，又停住了。",
            "空气中飘着旧书和麦芽的气味。",
            "角落里有人在低声交谈，听不清内容。",
            "门在你身后轻轻合上，发出沉闷的一声。",
            "墙上的烛火跳了跳，像是在打招呼。"
        ];
        function getRandomWelcome() {
            return welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
        }
        function displayWelcome() {
            const el = document.getElementById('welcome');
            if (el) el.textContent = getRandomWelcome();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', displayWelcome);
        } else {
            displayWelcome();
        }

        /* ============================================
           📖 今日手记（data/notes.json，每日一篇）
           ============================================ */
        let notesPool = [];
        const NOTE_FALLBACK_HTML = '<span class="note-empty">（手记被风吹走了……）</span>';

        function noteToHtml(note, linkBase) {
            let html = escapeHtml(note.text || '');
            (note.person || []).forEach(function (name) {
                const safe = escapeHtml(name);
                html = html.split(safe).join(
                    '<a class="tavern-person-link" href="' + linkBase + '?name=' + encodeURIComponent(name) + '">' + safe + '</a>'
                );
            });
            return html;
        }
        function todayNote() {
            if (!notesPool.length || !window.Tavern) return null;
            return notesPool[Tavern.todaysDrinkIndex(notesPool.length)];
        }
        function renderTodayNote() {
            const el = document.getElementById('note-text');
            const note = todayNote();
            if (!note) { el.innerHTML = NOTE_FALLBACK_HTML; return; }
            el.innerHTML = noteToHtml(note, 'drinker/index.html');
            Tavern.track('notesRead');
        }
        async function loadNotes() {
            try {
                const data = await Tavern.loadJSON('data/notes.json');
                notesPool = Array.isArray(data) ? data : [];
            } catch (e) { notesPool = []; }
            renderTodayNote();
        }
        function openPastNotes() {
            let overlay = document.getElementById('note-past-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'note-past-overlay';
                overlay.className = 'tavern-modal-overlay';
                overlay.innerHTML =
                    '<div class="tavern-modal" role="dialog" aria-modal="true" aria-label="往期手记">' +
                    '<div class="tavern-modal-title"><span>📖 往期手记</span><button class="tavern-modal-close" aria-label="关闭">×</button></div>' +
                    '<div id="note-past-list"></div>' +
                    '</div>';
                document.body.appendChild(overlay);
            }
            const today = todayNote();
            const list = document.getElementById('note-past-list');
            list.innerHTML = notesPool.map(function (n) {
                const isToday = today && n === today;
                const tag = isToday ? '<span class="note-tag">今日</span>' : '';
                return '<div class="tavern-note-item"><div class="note-text">' + tag + noteToHtml(n, 'drinker/index.html') + '</div></div>';
            }).join('');
            /* 统一走 core：Esc / 点遮罩 / ✕ / 背景滚动锁 / 焦点归还 */
            Tavern.openModal(overlay);
        }
        document.getElementById('note-past').addEventListener('click', function () {
            if (window.Tavern && notesPool.length) openPastNotes();
        });

        /* ============================================
           📜 随机碎片 + ✦ 故事碎片收集（data/fragments.json）
           ============================================ */
        let fragPool = [];
        let storyPool = [];
        let eggPool = [];   /* 彩蛋奖励碎片：只有找到对应隐藏彩蛋才会点亮 */
        const FRAG_FALLBACK = [
            { text: "麦酒凉了，但故事还是热的。", source: "吧台" },
            { text: "每一杯酒里都泡着一个秘密。", source: "吧台" },
            { text: "酒馆的门永远为你敞开。", source: "门牌" }
        ];
        async function loadFragments() {
            try {
                const data = await Tavern.loadJSON('data/fragments.json');
                fragPool = data && Array.isArray(data.fragments) && data.fragments.length ? data.fragments : FRAG_FALLBACK;
                storyPool = data && Array.isArray(data.story) ? data.story : [];
                eggPool = data && Array.isArray(data.eggFragments) ? data.eggFragments : [];
            } catch (e) {
                fragPool = FRAG_FALLBACK;
                storyPool = [];
                eggPool = [];
            }
            updateFragBadge();
        }
        function updateFragBadge() {
            const badge = document.getElementById('fragment-collection');
            if (!badge) return;
            if (!storyPool.length) { badge.style.display = 'none'; return; }
            badge.style.display = '';
            const got = Tavern.getStoryFragments();
            /* 徽标只统计「故事碎片」；彩蛋碎片在碎片集弹窗里单独计数 */
            const gotStory = storyPool.filter(function (s) { return got.indexOf(s.id) !== -1; }).length;
            document.getElementById('frag-count').textContent = gotStory;
            badge.classList.toggle('all', gotStory >= storyPool.length);
        }
        function showRandomFragment() {
            if (!window.Tavern || !Tavern.openFragment) return;
            Tavern.track('fragment');
            const got = Tavern.getStoryFragments();
            const next = storyPool.find(function (s) { return got.indexOf(s.id) === -1; });
            if (next && Tavern.getMetrics().fragmentsDrawn % 3 === 0) {
                Tavern.track('storyFragment', { id: next.id });
                const n = Tavern.getStoryFragments().length;
                Tavern.openFragment({ text: next.text, source: '故事碎片 ' + n + '/' + storyPool.length, special: true });
            } else {
                Tavern.openFragment(fragPool[Math.floor(Math.random() * fragPool.length)]);
            }
            updateFragBadge();
        }
        document.getElementById('fragment-trigger').addEventListener('click', showRandomFragment);

        function fragGridHtml(got) {
            return '<div class="tavern-frag-grid">' + storyPool.map(function (s, i) {
                if (got.indexOf(s.id) !== -1) {
                    return '<div class="tavern-frag-cell got"><div class="cell-no">✦ ' + (i + 1) + '</div><div class="cell-text">' + escapeHtml(s.text) + '</div></div>';
                }
                return '<div class="tavern-frag-cell locked"><div class="cell-no">✦ ' + (i + 1) + '</div><div class="cell-text">？？？</div></div>';
            }).join('') + '</div>';
        }
        /* 彩蛋碎片：找到对应隐藏彩蛋才点亮，显示奖励名与原文 */
        function eggGridHtml(got) {
            return '<div class="tavern-frag-grid">' + eggPool.map(function (s, i) {
                if (got.indexOf(s.id) !== -1) {
                    return '<div class="tavern-frag-cell got"><div class="cell-no">🥚 ' + (i + 1) + '</div><div class="cell-text"><b>' + escapeHtml(s.name) + '</b><br>' + escapeHtml(s.text) + '</div></div>';
                }
                return '<div class="tavern-frag-cell locked"><div class="cell-no">🥚 ' + (i + 1) + '</div><div class="cell-text">？？？</div></div>';
            }).join('') + '</div>';
        }
        function openFragmentCollection() {
            let overlay = document.getElementById('frag-collection-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'frag-collection-overlay';
                overlay.className = 'tavern-modal-overlay';
                overlay.innerHTML =
                    '<div class="tavern-modal" role="dialog" aria-modal="true" aria-label="碎片集">' +
                    '<div class="tavern-modal-title"><span>✦ 碎片集 <span id="coll-count"></span></span><button class="tavern-modal-close" aria-label="关闭">×</button></div>' +
                    '<div id="coll-body"></div>' +
                    '</div>';
                document.body.appendChild(overlay);
            }
            const got = Tavern.getStoryFragments();
            const gotStory = storyPool.filter(function (s) { return got.indexOf(s.id) !== -1; }).length;
            const gotEgg = eggPool.filter(function (s) { return got.indexOf(s.id) !== -1; }).length;
            document.getElementById('coll-count').textContent = gotStory + '/' + storyPool.length;
            const body = document.getElementById('coll-body');
            let html = '';
            if (storyPool.length && gotStory >= storyPool.length) {
                html += '<div class="tavern-frag-story-full">' + escapeHtml(storyPool.map(function (s) { return s.text; }).join('')) + '</div>';
            }
            html += fragGridHtml(got);
            if (eggPool.length) {
                html += '<div class="tavern-frag-subhead">🥚 彩蛋碎片 · ' + gotEgg + '/' + eggPool.length + '</div>' + eggGridHtml(got);
            }
            body.innerHTML = html;
            /* 统一走 core：Esc / 点遮罩 / ✕ / 背景滚动锁 / 焦点归还 */
            Tavern.openModal(overlay);
        }
        document.getElementById('fragment-collection').addEventListener('click', function () {
            if (window.Tavern && (storyPool.length || eggPool.length)) openFragmentCollection();
        });

        /* ============================================
           📚 档案借阅记录渲染
           ============================================ */
        const BORROW_KEY = 'tavern_borrow_log';
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }
        function renderBorrowLog() {
            const list = document.getElementById('borrow-list');
            const count = document.getElementById('borrow-count');
            let logs = [];
            try { logs = JSON.parse(localStorage.getItem(BORROW_KEY) || '[]'); }
            catch (e) { logs = []; }
            if (!logs.length) {
                list.innerHTML = '<div style="color:var(--gold);font-size:12px;text-align:center;padding:12px 0;opacity:0.4;">还没有借阅记录。点击人物卡片的"查看原始卡片"开始记录。</div>';
                count.textContent = '0 次';
                return;
            }
            count.textContent = logs.length + ' 次';
            list.innerHTML = logs.slice(0, 20).map(function (log) {
                return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(214,168,93,0.06);">' +
                    '<span style="color:#f5e68a;">' + escapeHtml(log.name) + '</span>' +
                    '<span style="font-size:11px;color:rgba(245,230,138,0.5);">' + escapeHtml(log.time) + '</span>' +
                    '</div>';
            }).join('');
        }
        document.getElementById('borrow-clear').addEventListener('click', function () {
            if (confirm('确定要清空所有借阅记录吗？')) {
                localStorage.setItem(BORROW_KEY, '[]');
                renderBorrowLog();
            }
        });
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderBorrowLog);
        } else {
            renderBorrowLog();
        }

        // 初始化数据
        if (window.Tavern) {
            loadNotes();
            loadFragments();
        } else {
            document.getElementById('note-text').innerHTML = NOTE_FALLBACK_HTML;
        }
    </script>
</body>
</html>
