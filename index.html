// 用户可见文字统一转义，避免人物资料中的符号影响 HTML 结构。
function esc(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[character]));
}

// 将一条人物资料拆成头部信息、简介和六个既有栏目。
function renderSections(person) {
  const sections = [
    ['WEAKNESS', person.weak],
    ['SKILL', person.skill],
    ['RELATED', person.related],
    ['VALUE SYSTEM', person.value],
    ['SYNTHESIS', person.syn],
    ['CONCLUSION', person.con]
  ];

  return sections
    .map(([title, text], index) => `
      <div class="section ${index === 5 ? 'full' : ''}">
        <h3>${title}</h3>
        <p>${esc(text)}</p>
      </div>`)
    .join('');
}

function card(person, index) {
  const image = `${CHARACTER_ROOT}${encodeURI(person.file)}`;
  const portraitSrc = person.portrait ? `${ID_ROOT}${encodeURI(person.portrait)}` : '';
  const portrait = portraitSrc
    ? `<img class="portrait" src="${portraitSrc}" data-full="${image}" alt="${esc(person.name)}证件照">`
    : '<div class="portrait portrait-placeholder">证件照<br>未登记</div>';

  const background = person.detail ? `
    <div class="section full" style="margin-top:10px">
      <h3>BACKGROUND NOTE</h3>
      <p>${esc(person.detail)}</p>
    </div>` : '';

  return `<article class="card" data-text="${esc(Object.values(person).join(' '))}" data-seat="${esc(person.seat)}" style="animation-delay:${index * 35}ms">
    <div class="card-head">
      ${portrait}
      <div>
        <h2>${esc(person.name)}</h2>
        <div class="alias">16号螺旋酒馆 · 旅客档案</div>
        <div class="facts">
          <span>AGE<b>${esc(person.age)}</b></span>
          <span>HEIGHT<b>${esc(person.height)}</b></span>
          <span>WEIGHT<b>${esc(person.weight)}</b></span>
          <span>SEAT<b class="seat">${esc(person.seat)}</b></span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <p class="intro">${esc(person.intro)}</p>
      <div class="sections">${renderSections(person)}</div>
      ${background}
      <a class="source" href="${image}" target="_blank" rel="noreferrer">查看原始卡片 ↗</a>
    </div>
  </article>`;
}

// 搜索与座位筛选共用这一处渲染入口，保持结果数量同步。
function render() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const seat = document.getElementById('seat').value;
  const visiblePeople = people.filter(person => {
    const matchesQuery = !query || Object.values(person).join(' ').toLowerCase().includes(query);
    const matchesSeat = !seat || (seat === '?' ? person.seat === '未登记' : person.seat.startsWith(seat));
    return matchesQuery && matchesSeat;
  });

  document.getElementById('cards').innerHTML = visiblePeople.length
    ? visiblePeople.map(card).join('')
    : '<div class="empty">没有找到对应的酒客档案。</div>';
  document.getElementById('count').textContent = `${visiblePeople.length} / ${people.length} 位旅客`;
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('seat').addEventListener('change', render);
document.getElementById('cards').addEventListener('click', event => {
  const target = event.target.closest('.portrait');
  if (!target || !target.dataset.full) return;

  document.getElementById('lightboxImg').src = target.dataset.full;
  document.getElementById('lightbox').classList.add('open');
});
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
render();
</script>
